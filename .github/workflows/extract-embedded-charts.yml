name: Extract embedded Sonic EXE charts
run-name: Extract recovered song charts from Windows executable

on:
  push:
    paths:
      - ".github/workflows/extract-embedded-charts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download and reassemble release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../release.zip
          cd ..

      - name: Extract charts and create browser-engine compatible JSON
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath, Path
          from urllib.parse import unquote
          import json, re, hashlib, csv

          def canonical(value):
              return ''.join(ch for ch in value.casefold() if ch.isalnum())

          def psych_song_path(value):
              value = value.replace(' ', '-')
              value = re.sub(r'[~&\\;:<>#]', '-', value)
              value = re.sub(r'[.,\'"%?!]', '', value)
              return value.lower()

          with ZipFile("release.zip") as z:
              exe_info = next(i for i in z.infolist() if PurePosixPath(i.filename).name.lower() == "vs sonic.exe")
              data = z.read(exe_info)
              manifest = json.loads(z.read("manifest/default.json").decode("utf-8-sig"))

          # The manifest stores its asset registry as one long serialized string.
          # Decode URL-escaped paths, then select only exact chart files of the form
          # contents/<GROUP>/data/<song>/<song>.json.
          manifest_strings = []
          def collect_strings(value):
              if isinstance(value, dict):
                  for child in value.values():
                      collect_strings(child)
              elif isinstance(value, list):
                  for child in value:
                      collect_strings(child)
              elif isinstance(value, str):
                  manifest_strings.append(unquote(value))

          collect_strings(manifest)
          chart_paths = set()
          path_pattern = r"contents/[^\\x00\\r\\n\\\"'<>|*?:]{1,500}?\\.json"
          for value in manifest_strings:
              for match in re.finditer(path_pattern, value, re.I):
                  candidate = match.group().replace("\\\\\\\\", "/")
                  if re.fullmatch(r"contents/[^/]+/data/[^/]+/[^/]+\\.json", candidate, re.I):
                      chart_paths.add(candidate)

          chart_paths = sorted(chart_paths)
          decoder = json.JSONDecoder()
          format_positions = [m.start() for m in re.finditer(b'psych_v1_convert', data)]
          charts = []
          seen_starts = set()
          failures = 0
          unmatched = []
          output_root = Path("embedded-charts")
          original_root = output_root / "original"
          engine_root = output_root / "psych-engine" / "assets" / "shared" / "data"

          for fmt_pos in format_positions:
              lower = max(0, fmt_pos - 20_000_000)
              p1 = data.rfind(b'"player1"', lower, fmt_pos)
              p2 = data.rfind(b'"player2"', lower, fmt_pos)
              player_fields = [p for p in (p1, p2) if p >= 0]
              if not player_fields:
                  failures += 1
                  continue
              player_pos = min(player_fields)
              start = data.rfind(b'{', max(0, player_pos - 64), player_pos)
              if start < 0 or start in seen_starts:
                  continue
              seen_starts.add(start)

              segment = data[start:start+20_000_000].decode("utf-8", "ignore")
              try:
                  obj, consumed = decoder.raw_decode(segment)
              except Exception:
                  failures += 1
                  continue

              if not isinstance(obj, dict):
                  failures += 1
                  continue
              notes = obj.get("notes")
              title = obj.get("song")
              if not isinstance(notes, list) or not isinstance(title, str):
                  failures += 1
                  continue

              note_count = sum(
                  len(section.get("sectionNotes", []))
                  for section in notes
                  if isinstance(section, dict) and isinstance(section.get("sectionNotes", []), list)
              )

              song_id = canonical(title)
              matches = [
                  path for path in chart_paths
                  if canonical(PurePosixPath(path).parent.name) == song_id
                  and canonical(PurePosixPath(path).stem) == song_id
              ]

              if len(matches) == 1:
                  original_path = matches[0]
              elif matches:
                  original_path = sorted(matches)[0]
              else:
                  original_path = ""
                  unmatched.append(title)

              # Keep the exact original top-level chart structure for reference.
              if original_path:
                  original_target = original_root / Path(*PurePosixPath(original_path).parts)
              else:
                  fallback_slug = re.sub(r'-+', '-', re.sub(r'[^a-z0-9]+', '-', title.lower())).strip('-')
                  original_target = original_root / "unmatched" / "data" / fallback_slug / f"{fallback_slug}.json"
              original_target.parent.mkdir(parents=True, exist_ok=True)
              original_target.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              # Psych Engine's Song.parseJSONshit reads Json.parse(rawJson).song.
              # Wrap the original chart object once, without altering its notes.
              engine_slug = psych_song_path(title)
              engine_target = engine_root / engine_slug / f"{engine_slug}.json"
              engine_target.parent.mkdir(parents=True, exist_ok=True)
              engine_target.write_text(
                  json.dumps({"song": obj}, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )

              charts.append({
                  "song": title,
                  "bpm": obj.get("bpm"),
                  "sections": len(notes),
                  "notes": note_count,
                  "player1": obj.get("player1"),
                  "player2": obj.get("player2"),
                  "stage": obj.get("stage"),
                  "format": obj.get("format"),
                  "original_game_path": original_path or "UNMATCHED",
                  "psych_engine_path": str(engine_target.relative_to(output_root)).replace("\\\\", "/"),
                  "executable_offset": f"0x{start:x}",
                  "source_bytes": consumed
              })

          charts.sort(key=lambda c: c["song"].casefold())
          (output_root / "chart-index.json").write_text(
              json.dumps(charts, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          with (output_root / "chart-index.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=list(charts[0].keys()) if charts else ["song"])
              writer.writeheader()
              writer.writerows(charts)

          print(f"Executable SHA256: {hashlib.sha256(data).hexdigest()}")
          print(f"Embedded chart asset paths found: {len(chart_paths)}")
          print(f"psych_v1_convert markers: {len(format_positions)}")
          print(f"Complete chart files extracted: {len(charts)}")
          print(f"Total note events: {sum(c['notes'] for c in charts):,}")
          print(f"Parse failures: {failures}")
          print(f"Charts without exact embedded path match: {unmatched}")
          for c in charts:
              print(f"  {c['song']}: {c['notes']} notes | {c['original_game_path']} | {c['psych_engine_path']}")
          PY

      - name: Upload extracted and adapted chart files
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-extracted-charts
          path: embedded-charts/
          if-no-files-found: error
          retention-days: 14
