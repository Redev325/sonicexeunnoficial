name: Extract embedded Sonic EXE charts
run-name: Extract recovered song charts from Windows executable

on:
  push:
    paths:
      - ".github/workflows/extract-embedded-charts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download and reassemble release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../release.zip
          cd ..

      - name: Extract charts using the original game manifest paths
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath, Path
          import json, re, hashlib, csv

          def canonical(value):
              return ''.join(ch for ch in value.casefold() if ch.isalnum())

          with ZipFile("release.zip") as z:
              infos = z.infolist()
              exe_info = next(i for i in infos if PurePosixPath(i.filename).name.lower() == "vs sonic.exe")
              data = z.read(exe_info)

              from urllib.parse import unquote
              manifest = json.loads(z.read("manifest/default.json").decode("utf-8-sig"))
              manifest_paths = set()
              manifest_debug = []
              manifest_string_count = 0

              def collect_paths(value):
                  global manifest_string_count
                  if isinstance(value, dict):
                      for child in value.values():
                          collect_paths(child)
                  elif isinstance(value, list):
                      for child in value:
                          collect_paths(child)
                  elif isinstance(value, str):
                      decoded = unquote(value).replace("\\\\", "/")
                      if "contents/" in decoded.casefold():
                          manifest_string_count += 1
                          if len(manifest_debug) < 80:
                              manifest_debug.append(decoded[:500])
                          # Asset paths may be URL-encoded or embedded in an asset ID.
                          for match in re.finditer(r"contents/", decoded, re.I):
                              tail = decoded[match.start():]
                              end = tail.casefold().find(".json")
                              if end >= 0:
                                  candidate = tail[:end + 5].strip()
                                  if "/data/" in candidate.casefold() and re.search(r"/data/[^/]+/[^/]+\.json$", candidate, re.I):
                                      manifest_paths.add(candidate)

              collect_paths(manifest)
              chart_paths = sorted(manifest_paths)
              debug_text = [
                  "manifest/default.json inspection",
                  f"Root type: {type(manifest).__name__}",
                  f"Root keys: {list(manifest.keys()) if isinstance(manifest, dict) else 'not a dict'}",
                  f"Strings containing contents/: {manifest_string_count}",
                  f"Chart data paths discovered: {len(chart_paths)}",
                  "Discovered paths:",
                  *chart_paths,
                  "Sample containing strings:",
                  *manifest_debug
              ]
              Path("manifest-debug.txt").write_text("\\n".join(debug_text) + "\\n", encoding="utf-8")

          decoder = json.JSONDecoder()
          format_positions = [m.start() for m in re.finditer(b'psych_v1_convert', data)]
          charts = []
          seen_starts = set()
          failures = 0
          unmatched = []
          output_root = Path("embedded-charts")
          output_root.mkdir(exist_ok=True)

          for fmt_pos in format_positions:
              lower = max(0, fmt_pos - 20_000_000)
              p1 = data.rfind(b'"player1"', lower, fmt_pos)
              p2 = data.rfind(b'"player2"', lower, fmt_pos)
              player_fields = [p for p in (p1, p2) if p >= 0]
              if not player_fields:
                  failures += 1
                  continue
              player_pos = min(player_fields)
              start = data.rfind(b'{', max(0, player_pos - 64), player_pos)
              if start < 0 or start in seen_starts:
                  continue
              seen_starts.add(start)

              segment = data[start:start+20_000_000].decode("utf-8", "ignore")
              try:
                  obj, consumed = decoder.raw_decode(segment)
              except Exception:
                  failures += 1
                  continue

              if not isinstance(obj, dict):
                  failures += 1
                  continue
              notes = obj.get("notes")
              title = obj.get("song")
              if not isinstance(notes, list) or not isinstance(title, str):
                  failures += 1
                  continue

              note_count = sum(
                  len(section.get("sectionNotes", []))
                  for section in notes
                  if isinstance(section, dict) and isinstance(section.get("sectionNotes", []), list)
              )

              song_id = canonical(title)
              matches = []
              for path in chart_paths:
                  folder = PurePosixPath(path).parent.name
                  filename_stem = PurePosixPath(path).stem
                  if canonical(folder) == song_id or canonical(filename_stem) == song_id:
                      matches.append(path)

              if len(matches) == 1:
                  original_path = matches[0]
                  relative_path = Path(*PurePosixPath(original_path).parts)
                  group = PurePosixPath(original_path).parts[1] if len(PurePosixPath(original_path).parts) > 1 else "_UNKNOWN_"
              elif matches:
                  # Prefer the entry whose folder and basename both match the title.
                  exact = [
                      p for p in matches
                      if canonical(PurePosixPath(p).parent.name) == song_id
                      and canonical(PurePosixPath(p).stem) == song_id
                  ]
                  original_path = exact[0] if len(exact) == 1 else sorted(matches)[0]
                  relative_path = Path(*PurePosixPath(original_path).parts)
                  group = PurePosixPath(original_path).parts[1] if len(PurePosixPath(original_path).parts) > 1 else "_UNKNOWN_"
              else:
                  unmatched.append(title)
                  song_slug = re.sub(r'-+', '-', re.sub(r'[^a-z0-9]+', '-', title.lower())).strip('-')
                  group = "_UNMATCHED_"
                  relative_path = Path("contents") / group / "data" / song_slug / f"{song_slug}.json"

              target = output_root / relative_path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              charts.append({
                  "song": title,
                  "bpm": obj.get("bpm"),
                  "sections": len(notes),
                  "notes": note_count,
                  "player1": obj.get("player1"),
                  "player2": obj.get("player2"),
                  "stage": obj.get("stage"),
                  "format": obj.get("format"),
                  "original_game_path": str(relative_path).replace("\\", "/"),
                  "executable_offset": f"0x{start:x}",
                  "source_bytes": consumed
              })

          charts.sort(key=lambda c: c["song"].casefold())
          (output_root / "chart-index.json").write_text(
              json.dumps(charts, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          with (output_root / "chart-index.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=list(charts[0].keys()) if charts else ["song"])
              writer.writeheader()
              writer.writerows(charts)

          total_notes = sum(c["notes"] for c in charts)
          print(f"Executable SHA256: {hashlib.sha256(data).hexdigest()}")
          print(f"Manifest chart paths found: {len(chart_paths)}")
          print(f"psych_v1_convert markers: {len(format_positions)}")
          print(f"Complete chart files extracted: {len(charts)}")
          print(f"Total note events: {total_notes:,}")
          print(f"Parse failures: {failures}")
          print(f"Charts without original manifest path: {unmatched}")
          print("Extracted chart paths:")
          for c in charts:
              print(f"  {c['song']}: {c['notes']} notes -> {c['original_game_path']}")
          PY

      - name: Upload extracted chart files
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-extracted-charts
          path: |
            embedded-charts/
            manifest-debug.txt
          if-no-files-found: error
          retention-days: 14
