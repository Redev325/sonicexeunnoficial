name: Extract embedded Sonic EXE charts
run-name: Extract recovered song charts from Windows executable

on:
  push:
    paths:
      - ".github/workflows/extract-embedded-charts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download and reassemble release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../release.zip
          cd ..

      - name: Extract complete charts and build index
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath, Path
          import json, re, hashlib, csv

          def slug(value):
              return re.sub(r'-+', '-', re.sub(r'[^a-z0-9]+', '-', value.lower())).strip('-')

          with ZipFile("release.zip") as z:
              infos = z.infolist()
              exe_info = next(i for i in infos if PurePosixPath(i.filename).name.lower() == "vs sonic.exe")
              data = z.read(exe_info)

              # Match a chart title to its original content group using the song audio path.
              audio_dirs = {}
              for info in infos:
                  m = re.fullmatch(r'contents/([^/]+)/songs/([^/]+)/inst\.ogg', info.filename, re.I)
                  if m:
                      audio_dirs[slug(m.group(2))] = m.group(1)

          decoder = json.JSONDecoder()
          format_positions = [m.start() for m in re.finditer(b'psych_v1_convert', data)]
          charts = []
          seen_starts = set()
          failures = 0
          output_root = Path("embedded-charts")
          output_root.mkdir(exist_ok=True)

          for fmt_pos in format_positions:
              lower = max(0, fmt_pos - 20_000_000)
              p1 = data.rfind(b'"player1"', lower, fmt_pos)
              p2 = data.rfind(b'"player2"', lower, fmt_pos)
              player_fields = [p for p in (p1, p2) if p >= 0]
              if not player_fields:
                  failures += 1
                  continue
              player_pos = min(player_fields)
              start = data.rfind(b'{', max(0, player_pos - 64), player_pos)
              if start < 0 or start in seen_starts:
                  continue
              seen_starts.add(start)

              segment = data[start:start+20_000_000].decode("utf-8", "ignore")
              try:
                  obj, consumed = decoder.raw_decode(segment)
              except Exception:
                  failures += 1
                  continue

              if not isinstance(obj, dict):
                  failures += 1
                  continue
              notes = obj.get("notes")
              title = obj.get("song")
              if not isinstance(notes, list) or not isinstance(title, str):
                  failures += 1
                  continue
              note_count = sum(
                  len(section.get("sectionNotes", []))
                  for section in notes
                  if isinstance(section, dict) and isinstance(section.get("sectionNotes", []), list)
              )

              song_slug = slug(title)
              group = audio_dirs.get(song_slug, "_EXTRACTED_")
              relative_path = Path("contents") / group / "data" / song_slug / f"{song_slug}.json"
              target = output_root / relative_path
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.exists():
                  target = target.with_name(target.stem + f"-{len(charts)+1}" + target.suffix)
              target.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              charts.append({
                  "song": title,
                  "bpm": obj.get("bpm"),
                  "sections": len(notes),
                  "notes": note_count,
                  "player1": obj.get("player1"),
                  "player2": obj.get("player2"),
                  "stage": obj.get("stage"),
                  "format": obj.get("format"),
                  "executable_offset": f"0x{start:x}",
                  "source_bytes": consumed,
                  "output_file": str(target).replace("embedded-charts/", "")
              })

          charts.sort(key=lambda c: c["song"].casefold())
          (output_root / "chart-index.json").write_text(
              json.dumps(charts, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          with (output_root / "chart-index.csv").open("w", newline="", encoding="utf-8") as f:
              writer = csv.DictWriter(f, fieldnames=list(charts[0].keys()) if charts else ["song"])
              writer.writeheader()
              writer.writerows(charts)

          total_notes = sum(c["notes"] for c in charts)
          print(f"Executable SHA256: {hashlib.sha256(data).hexdigest()}")
          print(f"psych_v1_convert markers: {len(format_positions)}")
          print(f"Complete chart files extracted: {len(charts)}")
          print(f"Total note events: {total_notes:,}")
          print(f"Parse failures: {failures}")
          print("Extracted files:")
          for c in charts:
              print(f"  {c['song']}: {c['notes']} notes -> {c['output_file']}")
          PY

      - name: Upload extracted chart files
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-extracted-charts
          path: embedded-charts/
          if-no-files-found: error
          retention-days: 14
