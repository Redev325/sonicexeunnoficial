name: Extract embedded Sonic EXE chart index
run-name: Locate embedded song charts inside Windows executable

on:
  push:
    paths:
      - ".github/workflows/extract-embedded-charts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download and reassemble release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../release.zip
          cd ..

      - name: Extract embedded chart metadata
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          import json, re, hashlib

          with ZipFile("release.zip") as z:
              exe_info = next(i for i in z.infolist() if PurePosixPath(i.filename).name.lower() == "vs sonic.exe")
              data = z.read(exe_info)

          report = []
          def out(s=""): report.append(str(s))
          out("SONIC.EXE UNOFFICIAL 1.0.0 - EMBEDDED CHART INDEX")
          out(f"Executable size: {len(data):,} bytes")
          out("SHA256: "+hashlib.sha256(data).hexdigest())
          out()

          for marker in (b'mustHitSection', b'sectionNotes', b'"bpm"', b'"notes"', b'"song":', b'psych_v1_convert'):
              positions = [m.start() for m in re.finditer(re.escape(marker), data)]
              out(f"{marker.decode('ascii')}: {len(positions)} occurrences")
              for pos in positions[:2]:
                  out(f"  offset 0x{pos:x}: {data[max(0,pos-80):pos+180]!r}")
          out()

          # This build stores Psych Engine v1 charts as top-level objects:
          # { "player1": ..., "player2": ..., "notes": [...], "song": "...", ... }
          # Locate each format marker, then parse backward from the player fields.
          format_positions = [m.start() for m in re.finditer(b'psych_v1_convert', data)]
          decoder = json.JSONDecoder()
          charts = []
          seen_starts = set()
          failures = 0

          for fmt_pos in format_positions:
              lower = max(0, fmt_pos - 20_000_000)
              p1 = data.rfind(b'"player1"', lower, fmt_pos)
              p2 = data.rfind(b'"player2"', lower, fmt_pos)
              player_fields = [p for p in (p1, p2) if p >= 0]
              if not player_fields:
                  failures += 1
                  continue
              player_pos = min(player_fields)

              # The opening brace is immediately before the first root field.
              start = data.rfind(b'{', max(0, player_pos - 64), player_pos)
              if start < 0 or start in seen_starts:
                  continue
              seen_starts.add(start)

              segment = data[start:start+20_000_000].decode("utf-8", "ignore")
              try:
                  obj, consumed = decoder.raw_decode(segment)
              except Exception:
                  failures += 1
                  continue

              if not isinstance(obj, dict):
                  failures += 1
                  continue
              notes = obj.get("notes")
              title = obj.get("song")
              if not isinstance(notes, list) or not isinstance(title, str):
                  failures += 1
                  continue
              note_count = sum(
                  len(section.get("sectionNotes", []))
                  for section in notes
                  if isinstance(section, dict) and isinstance(section.get("sectionNotes", []), list)
              )
              charts.append({
                  "offset": f"0x{start:x}",
                  "bytes": consumed,
                  "song": title[:160],
                  "bpm": obj.get("bpm"),
                  "format": obj.get("format"),
                  "sections": len(notes),
                  "notes": note_count,
                  "player1": obj.get("player1"),
                  "player2": obj.get("player2"),
                  "stage": obj.get("stage")
              })

          charts.sort(key=lambda x: int(x["offset"], 16))
          out(f"psych_v1_convert markers: {len(format_positions)}")
          out(f"Complete chart objects parsed: {len(charts)}")
          out(f"Candidate parse failures/skips: {failures}")
          out()
          for chart in charts:
              out(json.dumps(chart, ensure_ascii=False))
          if not charts:
              out("No complete top-level chart object was recovered with the first-pass parser.")
          out()

          # Include context around a parsed chart start to confirm the source layout.
          if charts:
              start = int(charts[0]["offset"], 16)
              out("First parsed chart opening:")
              out(repr(data[start:start+1200]))
              out("First parsed chart ending:")
              out(repr(data[start+charts[0]["bytes"]-500:start+charts[0]["bytes"]+80]))

          open("embedded-chart-index.txt","w",encoding="utf-8").write("\n".join(report)+"\n")
          print("\n".join(report))
          PY

      - name: Upload embedded chart index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-embedded-chart-index
          path: embedded-chart-index.txt
          if-no-files-found: warn
          retention-days: 14
