name: Inspect original menu references
run-name: Inspect Sonic EXE menu asset references

on:
  push:
    paths:
      - ".github/workflows/inspect-menu-reference.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../release.zip
          cd ..

      - name: Inspect menu-related asset metadata and executable strings
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          from collections import Counter
          import re

          try:
              from PIL import Image
              from io import BytesIO
          except Exception:
              Image = None
              BytesIO = None

          keywords = re.compile(
              r'menu|title|logo|button|prompt|story|freeplay|option|week|background|'
              r'bg|cursor|confirm|select|start|intro|press',
              re.I
          )
          report = [
              "SONIC.EXE UNOFFICIAL — MENU REFERENCE INSPECTION",
              "Metadata only. No original media is copied into this report.",
              ""
          ]

          def add(value=""):
              report.append(str(value))

          with ZipFile("release.zip") as z:
              infos = [x for x in z.infolist() if not x.is_dir()]
              shared = [x for x in infos if x.filename.casefold().startswith("contents/images/")]
              image_exts = {".webp", ".png", ".jpg", ".jpeg", ".gif"}
              root_images = [
                  x for x in infos
                  if x.filename.casefold().startswith("assets/")
                  and PurePosixPath(x.filename).suffix.casefold() in image_exts
              ]
              root_ui_images = [
                  x for x in root_images
                  if keywords.search(x.filename)
              ]
              matches = [
                  x for x in infos
                  if x.filename.casefold().startswith("contents/")
                  and keywords.search(PurePosixPath(x.filename).name)
                  and PurePosixPath(x.filename).suffix.casefold() in {
                      ".webp", ".png", ".jpg", ".jpeg", ".xml", ".json", ".txt", ".ttf"
                  }
              ]

              add(f"Shared contents/images files: {len(shared)}")
              add(f"Root assets image files: {len(root_images)}")
              add(f"Root assets UI/logo/menu image candidates: {len(root_ui_images)}")
              add("ROOT ASSETS UI/LOGO/MENU IMAGE CANDIDATES:")
              for x in sorted(root_ui_images, key=lambda v:(v.filename.casefold(), v.file_size)):
                  dims = ""
                  if Image is not None:
                      try:
                          with Image.open(BytesIO(z.read(x))) as im:
                              dims = f" [{im.width}x{im.height}]"
                      except Exception:
                          pass
                  add(f"  {x.file_size:>10,} bytes{dims}  {x.filename}")
              add()
              add("SHARED UI IMAGE PATHS:")
              for x in sorted(shared, key=lambda v:v.filename.casefold()):
                  dims = ""
                  if Image is not None and PurePosixPath(x.filename).suffix.casefold() in {".webp",".png",".jpg",".jpeg"}:
                      try:
                          with Image.open(BytesIO(z.read(x))) as im:
                              dims = f" [{im.width}x{im.height}]"
                      except Exception:
                          pass
                  add(f"  {x.file_size:>10,} bytes{dims}  {x.filename}")

              add()
              add(f"Menu-keyword file matches across content packs: {len(matches)}")
              add("MENU-RELATED PATHS:")
              for x in sorted(matches, key=lambda v:(v.filename.casefold(), v.file_size)):
                  dims = ""
                  if Image is not None and PurePosixPath(x.filename).suffix.casefold() in {".webp",".png",".jpg",".jpeg"}:
                      try:
                          with Image.open(BytesIO(z.read(x))) as im:
                              dims = f" [{im.width}x{im.height}]"
                      except Exception:
                          pass
                  add(f"  {x.file_size:>10,} bytes{dims}  {x.filename}")

              exe = next((x for x in infos if PurePosixPath(x.filename).name.casefold() == "vs sonic.exe"), None)
              if exe:
                  data = z.read(exe)
                  strings = {
                      m.group().decode("utf-8", "replace")
                      for m in re.finditer(rb"[ -~]{4,}", data)
                  }
                  relevant = sorted(
                      (s for s in strings if keywords.search(s) and len(s) <= 180),
                      key=str.casefold
                  )
                  add()
                  add(f"Executable: {exe.file_size:,} bytes")
                  add("MENU/STATE-RELATED EXECUTABLE STRINGS:")
                  for s in relevant[:500]:
                      add("  " + s)

              add()
              add("LOOSE SOURCE FILES:")
              source = [
                  x.filename for x in infos
                  if PurePosixPath(x.filename).suffix.casefold() in {
                      ".hx", ".hxml", ".hxc", ".cpp", ".h", ".lua"
                  }
              ]
              for name in source[:500]:
                  add("  " + name)
              add(f"Loose source count: {len(source)}")

          output = "\n".join(report) + "\n"
          open("menu-reference-report.txt", "w", encoding="utf-8").write(output)
          print(output)
          PY

      - name: Extract original main-menu and title-screen artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import shutil

          import re

          image_prefixes = (
              "assets/exe/mainmenu/",
              "assets/exe/title/",
              "assets/exe/options/",
          )
          explicit_paths = {
              "assets/exe/backButton.webp",
              "assets/exe/backButton.xml",
              "assets/shared/images/menuDesat.webp",
          }
          selected_fonts = {
              "assets/fonts/vcr.ttf",
              "assets/fonts/pixel-latin.ttf",
              "assets/fonts/NiseSega.ttf",
              "assets/fonts/NiseSegaSonic.TTF",
              "assets/fonts/SonicFont.ttf",
              "assets/fonts/SonicCD.ttf",
              "assets/fonts/sonic4.ttf",
              "assets/fonts/sonichud.ttf",
              "assets/fonts/Plaza Regular.ttf",
              "assets/fonts/fps.ttf",
          }
          allowed = {".webp", ".png", ".xml", ".json", ".ttf", ".otf"}
          output = Path("original-game-ui-assets")
          copied = []
          with ZipFile("release.zip") as z:
              for name in z.namelist():
                  suffix = Path(name).suffix.casefold()
                  is_ui_image = name.startswith(image_prefixes) or name in explicit_paths
                  is_font = name in selected_fonts
                  if name.endswith("/") or not (is_ui_image or is_font):
                      continue
                  if suffix not in allowed:
                      continue
                  target = output / Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(name) as source, target.open("wb") as dest:
                      shutil.copyfileobj(source, dest)
                  copied.append((name, target.stat().st_size))
          for name, size in copied:
              print(f"{size:>10,} bytes  {name}")
          print(f"Extracted {len(copied)} original UI assets.")
          PY

      - name: Upload original menu artwork
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-original-game-ui-assets
          path: |
            menu-reference-report.txt
            original-game-ui-assets/
          if-no-files-found: error
          retention-days: 7
