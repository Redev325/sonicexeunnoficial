name: Build and deploy original main menu
run-name: Build and deploy original main menu

on:
  push:
    branches:
      - main
    paths:
      - "web/main-menu.html"
      - ".github/workflows/deploy-menu-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare standalone menu site
        run: |
          mkdir -p site
          cp web/main-menu.html site/index.html
          touch site/.nojekyll
          test -s site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy menu preview
        id: deployment
        uses: actions/deploy-pages@v4
