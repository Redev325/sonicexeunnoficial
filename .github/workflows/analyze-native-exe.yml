name: Analyze Sonic EXE native executable
run-name: Analyze Windows executable for embedded charts and scripts

on:
  push:
    paths:
      - ".github/workflows/analyze-native-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download and reassemble release archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../release.zip
          cd ..
          ls -lh release.zip

      - name: Extract executable and inspect binary and packaged data
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          python3 -m pip install --user pefile
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          from collections import Counter
          import hashlib, json, os, re, subprocess

          report = []
          def out(s=""):
              report.append(str(s))

          with ZipFile("release.zip") as z:
              files = [i for i in z.infolist() if not i.is_dir()]
              out("SONIC.EXE UNOFFICIAL 1.0.0 - NATIVE EXECUTABLE INVESTIGATION")
              out(f"Package files: {len(files)}")
              out(f"Unpacked bytes: {sum(i.file_size for i in files):,}")
              out()
              exes = [i for i in files if PurePosixPath(i.filename).suffix.lower() == ".exe"]
              out("EXECUTABLE FILES:")
              for i in exes:
                  out(f"  {i.file_size:>14,}  {i.filename}")
              out()

              # Find every likely chart/script/data file, not only JSON.
              out("PATHS WITH CHART / SONG / SCRIPT / DATA TERMS:")
              path_hits = [i for i in files if re.search(r"chart|song.?data|week.?data|script|\\bdata\\b|\\.hx(c)?$|\\.lua$|\\.hscript$", i.filename, re.I)]
              for i in path_hits[:1000]:
                  out(f"  {i.file_size:>12,}  {i.filename}")
              out(f"Total path matches: {len(path_hits)}")
              out()

              # Inspect all structured text formats for chart-like fields.
              structured = [i for i in files if PurePosixPath(i.filename).suffix.lower() in {".json",".xml",".txt",".dat",".ini",".cfg",".lua",".hx",".hxc",".hscript",".yaml",".yml"}]
              key_counts = Counter()
              chart_hits = []
              text_hits = []
              manifest = None
              for i in structured:
                  if i.file_size > 20_000_000:
                      continue
                  raw = z.read(i)
                  txt = raw.decode("utf-8-sig", "ignore")
                  if i.filename.lower() == "manifest/default.json":
                      try: manifest = json.loads(txt)
                      except Exception: pass
                  if PurePosixPath(i.filename).suffix.lower() == ".json":
                      try:
                          obj = json.loads(txt)
                          def walk(v, path="$"):
                              if isinstance(v, dict):
                                  keys = {str(k).lower() for k in v}
                                  for k in keys:
                                      if k in {"notes","bpm","musthitsection","sectionnotes","chart","songdata","songname","sections"}:
                                          key_counts[k] += 1
                                  if "notes" in keys or ("bpm" in keys and ("song" in keys or "sections" in keys)):
                                      chart_hits.append((i.filename, path, sorted(keys)[:40]))
                                  for k, val in v.items(): walk(val, path+"."+str(k))
                              elif isinstance(v, list):
                                  for n, val in enumerate(v[:10000]): walk(val, path+f"[{n}]")
                          walk(obj)
                      except Exception:
                          pass
                  for term in ("mustHitSection","sectionNotes","songData","songName","bpm","charting","notes","LuaScript","HScript"):
                      if re.search(re.escape(term), txt, re.I):
                          text_hits.append((i.filename, term))
              out("STRUCTURED FILE EXTENSIONS:")
              out("  " + str(Counter(PurePosixPath(i.filename).suffix.lower() or "[none]" for i in structured)))
              out("CHART-LIKE JSON OBJECTS:")
              for h in chart_hits[:100]: out("  "+repr(h))
              if not chart_hits: out("  None found with note/BPM/section/song-data object fields.")
              out("Chart-related JSON key counts: " + repr(dict(key_counts)))
              out("TEXT FILES CONTAINING CHART / SCRIPT IDENTIFIERS:")
              for p,t in text_hits[:300]: out(f"  {p}: {t}")
              out()

              if manifest is not None:
                  out("MANIFEST/DEFAULT.JSON:")
                  out("  Root type: "+type(manifest).__name__)
                  if isinstance(manifest, dict):
                      out("  Root keys: "+repr(list(manifest.keys())[:100]))
                  mstrings = []
                  def walk_manifest(v):
                      if isinstance(v, dict):
                          for k,x in v.items():
                              if isinstance(x, str) and re.search(r"chart|song|week|script|\\.json|\\.lua|\\.hx", x, re.I):
                                  mstrings.append(x)
                              walk_manifest(x)
                      elif isinstance(v, list):
                          for x in v: walk_manifest(x)
                  walk_manifest(manifest)
                  out(f"  Manifest values matching chart/song/week/script/json/lua/hx: {len(mstrings)}")
                  for s in mstrings[:250]: out("    "+s)
                  out()

              # Extract the main game executable for PE metadata and string analysis.
              main = next((i for i in exes if PurePosixPath(i.filename).name.lower() == "vs sonic.exe"), None)
              if main is None and exes: main = max(exes, key=lambda i:i.file_size)
              if main:
                  data = z.read(main)
                  exe_path = "game.exe"
                  open(exe_path,"wb").write(data)
                  out("MAIN EXECUTABLE:")
                  out(f"  Path: {main.filename}")
                  out(f"  Size: {len(data):,} bytes")
                  out("  SHA256: "+hashlib.sha256(data).hexdigest())
                  out(f"  Header bytes: {data[:16].hex(' ')}")
                  try:
                      import pefile
                      pe = pefile.PE(exe_path, fast_load=False)
                      out(f"  PE machine: 0x{pe.FILE_HEADER.Machine:04x}")
                      out(f"  PE timestamp: {pe.FILE_HEADER.TimeDateStamp}")
                      out(f"  Subsystem: {pe.OPTIONAL_HEADER.Subsystem}")
                      out("  Sections:")
                      for s in pe.sections:
                          name=s.Name.rstrip(b"\\0").decode("ascii","replace")
                          out(f"    {name}: virtual={s.Misc_VirtualSize:,} raw={s.SizeOfRawData:,} entropy={s.get_entropy():.3f}")
                      pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_IMPORT"], pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_RESOURCE"]])
                      out("  Imported DLLs:")
                      for imp in getattr(pe,"DIRECTORY_ENTRY_IMPORT",[]):
                          out("    "+imp.dll.decode("ascii","replace"))
                      resources = getattr(pe,"DIRECTORY_ENTRY_RESOURCE",None)
                      out("  Resource directory: "+("present" if resources else "not present"))
                  except Exception as e:
                      out("  PE parse error: "+repr(e))
                  out()
                  # Both ASCII and UTF-16LE strings; filter to Haxe/Psych/chart/game identifiers.
                  for mode,args in [("ASCII",["strings","-a","-n","4",exe_path]),("UTF16LE",["strings","-el","-n","4",exe_path])]:
                      try:
                          raw=subprocess.check_output(args, text=True, errors="replace")
                          vals=[]
                          for line in raw.splitlines():
                              if re.search(r"chart|note|bpm|section|song|week|story|script|lua|hscript|psych|flixel|haxe|openfl|lime|manifest|json|difficulty|opponent|player|stage|mod",line,re.I):
                                  vals.append(line[:240])
                          out(f"{mode} STRINGS: {len(vals)} relevant strings (first 700)")
                          for v in vals[:700]: out("  "+v)
                      except Exception as e: out(f"  strings error: {e}")
                  out()
                  # Check whether common chart/schema words and representative song names
                  # occur literally in the compiled program.
                  tokens = [b'"notes"',b'"bpm"',b'"song"',b'"sections"',b'mustHitSection',b'sectionNotes',
                            b'final-escape',b'too-slow',b'triple-trouble',b'you-cant-run',b'black-sun']
                  out("LITERAL BINARY TOKEN CHECK:")
                  for token in tokens:
                      out(f"  {token.decode('ascii')}: {data.lower().count(token.lower())} occurrences")
                  out()

          open("native-analysis-report.txt","w",encoding="utf-8").write("\n".join(report)+"\n")
          print("\n".join(report))
          PY

      - name: Upload native executable analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-native-analysis
          path: native-analysis-report.txt
          if-no-files-found: warn
          retention-days: 14
