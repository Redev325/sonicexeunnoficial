name: Inspect Sonic EXE release package
run-name: Inspect Sonic EXE v1.0.0

on:
  push:
    paths:
      - ".github/workflows/inspect-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download the two release parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          test -s unofficial-windows.1.zip.001
          test -s unofficial-windows.1.zip.002
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../unofficial-windows-reassembled.zip
          cd ..
          ls -lh unofficial-windows-reassembled.zip

      - name: Inventory archive without running its contents
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import PurePosixPath
          from zipfile import ZipFile, BadZipFile

          archive = "unofficial-windows-reassembled.zip"
          report = ["Sonic EXE Unofficial 1.0.0 - focused package inspection", ""]
          try:
              with ZipFile(archive) as zf:
                  infos = zf.infolist()
                  files = [i for i in infos if not i.is_dir()]
                  extensions = Counter(PurePosixPath(i.filename).suffix.lower() or "[no extension]" for i in files)
                  top = Counter(i.filename.split("/", 1)[0] + ("/" if "/" in i.filename else "") for i in infos)
                  source_exts = {".hx", ".hxml", ".cpp", ".c", ".h", ".js", ".ts", ".wasm", ".html", ".gradle", ".java"}
                  binary_exts = {".exe", ".dll", ".so", ".dylib", ".ndll"}
                  sources = [i for i in files if PurePosixPath(i.filename).suffix.lower() in source_exts]
                  binaries = [i for i in files if PurePosixPath(i.filename).suffix.lower() in binary_exts]
                  shallow = [i for i in infos if len(PurePosixPath(i.filename).parts) <= 2]
                  report += [
                      "ZIP opened successfully: yes",
                      f"Entries: {len(infos)}",
                      f"Files: {len(files)}",
                      f"Total uncompressed size: {sum(i.file_size for i in files):,} bytes",
                      "",
                      "Top-level entries:",
                  ]
                  report.extend(f"  {name} ({count} entries)" for name, count in top.most_common(100))
                  report += ["", "Relevant extension counts:"]
                  for ext in sorted(set(source_exts | binary_exts)):
                      count = extensions.get(ext, 0)
                      if count:
                          report.append(f"  {ext}: {count}")
                  report += ["", "Build/source candidates:"]
                  if sources:
                      report.extend(f"  {i.filename} ({i.file_size:,} bytes)" for i in sources[:1000])
                  else:
                      report.append("  NONE FOUND for common Haxe/C/C++/JS/HTML/WebAssembly project source extensions.")
                  report += ["", "Compiled executables and runtime libraries:"]
                  report.extend(f"  {i.filename} ({i.file_size:,} bytes)" for i in binaries[:1000])
                  report += ["", "Shallow package layout (root and one folder deep):"]
                  report.extend(f"  {i.filename} ({i.file_size:,} bytes)" for i in shallow[:1000])
          except BadZipFile as exc:
              report += [f"ZIP validation failed: {exc}", "The split parts may not match or may be incomplete."]
          except Exception as exc:
              report += [f"Inspection error: {type(exc).__name__}: {exc}"]

          output = "\n".join(report) + "\n"
          print(output)
          with open("inspection-report.txt", "w", encoding="utf-8") as f:
              f.write(output)
          PY

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-inspection-report
          path: inspection-report.txt
          if-no-files-found: warn
          retention-days: 14
