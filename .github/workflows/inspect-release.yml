name: Inspect Sonic EXE release package
run-name: Inspect Sonic EXE v1.0.0

on:
  push:
    paths:
      - ".github/workflows/inspect-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download the two release parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          test -s unofficial-windows.1.zip.001
          test -s unofficial-windows.1.zip.002
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../unofficial-windows-reassembled.zip
          cd ..
          ls -lh unofficial-windows-reassembled.zip

      - name: Inspect charts, game data and media inventory
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          import json, re

          zpath = "unofficial-windows-reassembled.zip"
          report = ["Sonic EXE Unofficial 1.0.0 - source reconstruction inventory", ""]
          with ZipFile(zpath) as zf:
              infos = [x for x in zf.infolist() if not x.is_dir()]
              names = [x.filename for x in infos]
              ext = Counter(PurePosixPath(n).suffix.lower() or "[none]" for n in names)
              report += [f"Files: {len(infos)}", f"Unpacked size: {sum(x.file_size for x in infos):,} bytes", "", "Extensions:"]
              report += [f"  {e}: {n}" for e,n in ext.most_common(60)]
              json_files = [x for x in infos if x.filename.lower().endswith(".json")]
              report += ["", f"All JSON files ({len(json_files)}):"]
              report += [f"  {x.filename} ({x.file_size:,} bytes)" for x in json_files]
              chart_candidates = []
              json_samples = []
              for x in json_files:
                  if x.file_size > 8_000_000:
                      continue
                  try:
                      obj = json.loads(zf.read(x).decode("utf-8-sig"))
                      def has_chart(v):
                          if isinstance(v, dict):
                              keys={str(k).lower() for k in v.keys()}
                              if {"notes","bpm"}.issubset(keys) or "song" in keys and "notes" in keys:
                                  return True
                              return any(has_chart(y) for y in v.values())
                          if isinstance(v,list):
                              return any(has_chart(y) for y in v[:10000])
                          return False
                      if has_chart(obj):
                          chart_candidates.append(x.filename)
                      if len(json_samples)<20:
                          if isinstance(obj,dict):
                              json_samples.append((x.filename, list(obj.keys())[:30]))
                          else:
                              json_samples.append((x.filename, type(obj).__name__))
                  except Exception:
                      pass
              report += ["", "JSON files that look like song charts:"]
              report += [f"  {p}" for p in chart_candidates] or ["  NONE found by checking for note/BPM structures."]
              report += ["", "Sample JSON root keys:"]
              report += [f"  {p}: {k}" for p,k in json_samples]
              songs = [n for n in names if "/songs/" in n.lower()]
              report += ["", f"Song folder files: {len(songs)}", "First 300 song paths:"]
              report += [f"  {n}" for n in songs[:300]]
              data_like = [n for n in names if any(k in n.lower() for k in ("/data/","chart","week","songdata","song-data"))]
              report += ["", f"Potential data/chart paths: {len(data_like)}"]
              report += [f"  {n}" for n in data_like[:500]]
              exe = zf.read("Vs Sonic.exe")
              sstrings = [v.decode("ascii","replace") for v in re.findall(rb"[ -~]{5,}", exe)]
              report += ["", "Interesting strings from native executable:"]
              hits=[]
              for v in sstrings:
                  if re.search(r"psych|haxe|flixel|openfl|lime|chart|song|script|lua|week|story|mod|version",v,re.I):
                      hits.append(v[:220])
              seen=set()
              for v in hits:
                  if v not in seen:
                      report.append("  "+v)
                      seen.add(v)
                  if len(seen)>=200: break
              report += ["", "Top 30 largest media files:"]
              media=[x for x in infos if PurePosixPath(x.filename).suffix.lower() in {".ogg",".mp3",".wav",".mp4",".webm",".webp",".png",".jpg"}]
              report += [f"  {x.file_size:,} bytes  {x.filename}" for x in sorted(media,key=lambda x:x.file_size,reverse=True)[:30]]
          out="\n".join(report)+"\n"
          print(out)
          open("inspection-report.txt","w",encoding="utf-8").write(out)
          PY

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-inspection-report
          path: inspection-report.txt
          if-no-files-found: warn
          retention-days: 14
