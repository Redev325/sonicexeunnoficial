name: Inspect Sonic EXE compiled game data
run-name: Recover embedded character stage and week metadata

on:
  push:
    paths:
      - ".github/workflows/inspect-compiled-game-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download and reassemble release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../release.zip
          cd ..

      - name: Inspect embedded resource objects and Story Mode files
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          from collections import Counter
          import json, re, hashlib

          report=[]
          def out(v=""): report.append(str(v))

          with ZipFile("release.zip") as z:
              infos=[x for x in z.infolist() if not x.is_dir()]
              exe_info=next(x for x in infos if PurePosixPath(x.filename).name.lower()=="vs sonic.exe")
              data=z.read(exe_info)
              story=[x for x in infos if x.filename.casefold().startswith("contents/story mode/")]

              out("SONIC.EXE UNOFFICIAL - COMPILED GAME DATA INSPECTION")
              out(f"EXE bytes: {len(data):,}")
              out("EXE SHA256: "+hashlib.sha256(data).hexdigest())
              out(f"Story Mode files: {len(story)}")
              out(f"Story Mode bytes: {sum(x.file_size for x in story):,}")
              out("Story Mode extensions: "+repr(dict(Counter(PurePosixPath(x.filename).suffix.lower() for x in story))))
              out("STORY MODE FILES:")
              for x in sorted(story,key=lambda x:x.filename.casefold()):
                  out(f"  {x.file_size:>12,} {x.filename}")
              out()

          # Recover any plain JSON objects embedded in the executable.
          dec=json.JSONDecoder()
          markers=[
              b'"animations"',b'"healthicon"',b'"sing_duration"',b'"flip_x"',
              b'"defaultZoom"',b'"isPixelStage"',b'"weekCharacters"',
              b'"weekName"',b'"storyName"',b'"weekBefore"',b'"freeplayColor"',
              b'"psych_v1_convert"'
          ]
          candidates={"character":{},"stage":{},"week":{},"chart":{}}
          marker_counts={}
          for marker in markers:
              poslist=[m.start() for m in re.finditer(re.escape(marker),data)]
              marker_counts[marker.decode("ascii")]=len(poslist)
              for p in poslist:
                  low=max(0,p-12000)
                  # Try brace candidates from nearest to farthest, allowing JSON fields in any order.
                  starts=[m.start() for m in re.finditer(rb'\{',data[low:p+1])]
                  found=False
                  for rel in reversed(starts[-100:]):
                      start=low+rel
                      segment=data[start:min(len(data),start+2_000_000)].decode("utf-8","ignore")
                      try:
                          obj,used=dec.raw_decode(segment)
                      except Exception:
                          continue
                      if not isinstance(obj,dict):
                          continue
                      keys={str(k).casefold() for k in obj}
                      kind=None
                      if "animations" in keys and "image" in keys and ({"healthicon","sing_duration","flip_x"} & keys):
                          kind="character"
                      elif {"defaultzoom","ispixelstage","boyfriend","opponent","girlfriend"} & keys:
                          kind="stage"
                      elif {"weekcharacters","weekname","storyname","weekbefore"} & keys:
                          kind="week"
                      elif "format" in keys and "psych_v1_convert" in str(obj.get("format","")) and "notes" in keys:
                          kind="chart"
                      if kind:
                          signature=(start,used)
                          candidates[kind][signature]=obj
                          found=True
                          break
                  if found:
                      continue

          out("EMBEDDED JSON MARKER COUNTS:")
          for k,v in marker_counts.items(): out(f"  {k}: {v}")
          out()

          for kind,objects in candidates.items():
              out(f"RECOVERED {kind.upper()} OBJECTS: {len(objects)}")
              for (start,used),obj in sorted(objects.items(),key=lambda kv:kv[0][0])[:500]:
                  if kind=="character":
                      name=obj.get("healthicon") or obj.get("image") or obj.get("name")
                      summary={"name":name,"image":obj.get("image"),"healthicon":obj.get("healthicon"),
                               "animations":len(obj.get("animations",[])) if isinstance(obj.get("animations"),list) else None,
                               "flip_x":obj.get("flip_x"),"scale":obj.get("scale"),"position":obj.get("position"),
                               "camera_position":obj.get("camera_position")}
                  elif kind=="stage":
                      summary={k:obj.get(k) for k in ("directory","defaultZoom","isPixelStage","boyfriend","girlfriend","opponent","hide_girlfriend")}
                  elif kind=="week":
                      summary={k:obj.get(k) for k in ("weekName","storyName","weekBefore","weekCharacters","songs","difficulties","hideStoryMode","hideFreeplay")}
                  else:
                      summary={"song":obj.get("song"),"bpm":obj.get("bpm"),"sections":len(obj.get("notes",[]))}
                  out(f"  offset=0x{start:x} bytes={used} {json.dumps(summary,ensure_ascii=False)}")
              out()

          # Useful string-table scan, in both common encodings.
          for label,pattern in (("ASCII",rb"[ -~]{4,}"),("UTF16LE",rb"(?:[ -~]\x00){4,}")):
              values=[]
              for m in re.finditer(pattern,data):
                  raw=m.group()
                  try:
                      value=raw.decode("ascii" if label=="ASCII" else "utf-16le","ignore")
                  except Exception:
                      continue
                  if re.search(r"week|story|character|stage|lua|hscript|script|cutscene|song|event|note.?type|dialogue",value,re.I):
                      values.append(value[:250])
              out(f"{label} GAME-RELATED STRINGS: {len(values)}")
              for value in values[:800]: out("  "+value)
              out()

          open("compiled-game-data-report.txt","w",encoding="utf-8").write("\n".join(report)+"\n")
          print("\n".join(report))
          PY

      - name: Upload compiled game data report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-compiled-game-data
          path: compiled-game-data-report.txt
          if-no-files-found: warn
          retention-days: 14
