name: Extract Sonic EXE compiled metadata
run-name: Extract character stage and week definitions

on:
  push:
    paths:
      - ".github/workflows/inspect-compiled-game-data.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download and reassemble release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > ../release.zip
          cd ..

      - name: Extract complete JSON objects from executable
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath, Path
          import json, re, hashlib

          def slug(v):
              v = str(v or "unnamed").casefold()
              return re.sub(r"-+", "-", re.sub(r"[^a-z0-9]+", "-", v)).strip("-") or "unnamed"

          with ZipFile("release.zip") as z:
              info = next(x for x in z.infolist() if PurePosixPath(x.filename).name.lower() == "vs sonic.exe")
              data = z.read(info)

          decoder = json.JSONDecoder()
          markers = [
              b'"animations"', b'"healthicon"', b'"sing_duration"', b'"flip_x"',
              b'"defaultZoom"', b'"isPixelStage"', b'"weekCharacters"',
              b'"weekName"', b'"storyName"', b'"weekBefore"', b'"freeplayColor"'
          ]
          objects = {"character": {}, "stage": {}, "week": {}}
          marker_counts = {}

          for marker in markers:
              positions = [m.start() for m in re.finditer(re.escape(marker), data)]
              marker_counts[marker.decode("ascii")] = len(positions)
              for pos in positions:
                  lower = max(0, pos - 12000)
                  starts = [m.start() for m in re.finditer(rb'\{', data[lower:pos+1])]
                  for rel in reversed(starts[-100:]):
                      start = lower + rel
                      segment = data[start:min(len(data), start + 2_000_000)].decode("utf-8", "ignore")
                      try:
                          obj, used = decoder.raw_decode(segment)
                      except Exception:
                          continue
                      if not isinstance(obj, dict):
                          continue
                      keys = {str(k).casefold() for k in obj}
                      kind = None
                      if "animations" in keys and "image" in keys and ({"healthicon", "sing_duration", "flip_x"} & keys):
                          kind = "character"
                      elif "defaultzoom" in keys and "boyfriend" in keys and "opponent" in keys and "directory" in keys:
                          kind = "stage"
                      elif "weekcharacters" in keys and "songs" in keys and ("weekname" in keys or "storyname" in keys):
                          kind = "week"
                      if kind:
                          objects[kind][(start, used)] = obj
                          break

          out = Path("recovered-metadata")
          for kind in objects:
              (out / kind).mkdir(parents=True, exist_ok=True)

          index = []
          for kind, entries in objects.items():
              for (start, used), obj in sorted(entries.items()):
                  if kind == "character":
                      display = obj.get("name") or obj.get("healthicon") or obj.get("image")
                      filename = f"{slug(display)}-{start:08x}.json"
                  elif kind == "stage":
                      # The original stage filename is stored in the asset table;
                      # keep a stable offset name until that resource ID is mapped.
                      filename = f"stage-{start:08x}.json"
                  else:
                      display = obj.get("storyName") or obj.get("weekName") or "week"
                      filename = f"{slug(display)}-{start:08x}.json"

                  target = out / kind / filename
                  target.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  record = {
                      "type": kind, "offset": f"0x{start:x}", "bytes": used,
                      "file": str(target).replace("\\\\", "/")
                  }
                  if kind == "character":
                      record.update({
                          "name": obj.get("name"), "healthicon": obj.get("healthicon"),
                          "image": obj.get("image"), "animation_count": len(obj.get("animations", []))
                      })
                  elif kind == "stage":
                      record.update({
                          "defaultZoom": obj.get("defaultZoom"), "directory": obj.get("directory"),
                          "boyfriend": obj.get("boyfriend"), "girlfriend": obj.get("girlfriend"),
                          "opponent": obj.get("opponent"), "hide_girlfriend": obj.get("hide_girlfriend")
                      })
                  else:
                      record.update({
                          "weekName": obj.get("weekName"), "storyName": obj.get("storyName"),
                          "weekBefore": obj.get("weekBefore"), "songs": obj.get("songs"),
                          "hideStoryMode": obj.get("hideStoryMode"), "hideFreeplay": obj.get("hideFreeplay")
                      })
                  index.append(record)

          # Resource IDs reveal original virtual asset paths and are needed to
          # match recovered JSON bodies back to their contents/<GROUP>/ paths.
          asset_ids = sorted(set(
              m.group().decode("ascii", "ignore")
              for m in re.finditer(rb'__ASSET__contents_[A-Za-z0-9_]+', data)
          ))
          (out / "asset-resource-ids.txt").write_text("\n".join(asset_ids) + "\n", encoding="utf-8")
          (out / "metadata-index.json").write_text(json.dumps({
              "executable_sha256": hashlib.sha256(data).hexdigest(),
              "marker_counts": marker_counts,
              "counts": {k: len(v) for k, v in objects.items()},
              "asset_resource_id_count": len(asset_ids),
              "objects": index
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # The Xenophanes week is the five-song Story Mode route.
          xenophanes = next((obj for obj in objects["week"].values() if obj.get("weekName") == "Xenophanes"), None)
          if xenophanes:
              (out / "xenophanes-week.json").write_text(json.dumps(xenophanes, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          print("Executable SHA256:", hashlib.sha256(data).hexdigest())
          print("Embedded JSON markers:", marker_counts)
          print("Recovered complete objects:", {k: len(v) for k, v in objects.items()})
          print("Asset resource IDs:", len(asset_ids))
          print("Story Mode week:", json.dumps(xenophanes, ensure_ascii=False))
          print("Character files:", len(list((out / "character").glob("*.json"))))
          print("Stage files:", len(list((out / "stage").glob("*.json"))))
          print("Week files:", len(list((out / "week").glob("*.json"))))
          PY

      - name: Upload recovered game metadata
        uses: actions/upload-artifact@v4
        with:
          name: sonicexe-recovered-metadata
          path: recovered-metadata/
          if-no-files-found: error
          retention-days: 14
