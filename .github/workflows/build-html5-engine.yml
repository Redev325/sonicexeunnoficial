name: Build HTML5 engine base
run-name: Build HTML5 engine base

on:
  push:
    paths:
      - ".github/workflows/build-html5-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-html5:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libvlc-dev libvlccore-dev

      - name: Install Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.2.5"

      - name: Fetch open-source Psych Engine HTML5 base
        run: |
          git clone --depth 1 https://github.com/star-studios-official/FNF-PsychEngine-HTML5.git engine
          du -sh engine

      - name: Disable desktop-only Discord integration for web
        working-directory: engine
        run: |
          sed -i 's/<define name="DISCORD_ALLOWED" \/>/<define name="DISCORD_ALLOWED" if="desktop" \/>/' Project.xml
          grep 'DISCORD_ALLOWED' Project.xml

      - name: Install Haxe libraries
        working-directory: engine
        run: |
          haxelib setup "$HOME/haxelib"
          haxelib install hxcpp --quiet
          haxe -cp ./setup -D analyzer-optimize -main Main --interp

      - name: Patch browser compatibility in Psych Engine
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch_file(path_text, replacements):
              path = Path(path_text)
              if not path.is_file():
                  raise SystemExit(f"Expected source file was not found: {path}")
              source = path.read_text()
              for old, new, description in replacements:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"{path}: expected one match for {description}, found {count}"
                      )
                  source = source.replace(old, new, 1)
              path.write_text(source)
              print(f"Patched {path}")

          # HaxeFlixel 6 moved the crosshair graphic out of this internal package.
          # The Character Editor is not needed for normal browser gameplay, so use
          # a transparent placeholder instead of relying on that removed debug asset.
          patch_file("source/states/editors/CharacterEditorState.hx", [
              (
                  "import flixel.system.debug.interaction.tools.Pointer.GraphicCursorCross;\\n",
                  "",
                  "removed GraphicCursorCross import"
              ),
              (
                  "cameraFollowPointer = new FlxSprite().loadGraphic(FlxGraphic.fromClass(GraphicCursorCross));",
                  "cameraFollowPointer = new FlxSprite();\\n\\t\\tcameraFollowPointer.makeGraphic(40, 40, 0x00000000);",
                  "replaced removed GraphicCursorCross asset"
              )
          ])

          # Newer FlxInputText border enum variants need explicit switch cases.
          patch_file("source/flixel/addons/ui/FlxInputText.hx", [
              (
                  "case SHADOW:",
                  "case SHADOW, SHADOW_XY:",
                  "handled SHADOW_XY border style"
              ),
              (
                  "case OUTLINE_FAST, OUTLINE:",
                  "case OUTLINE_CARDINAL, OUTLINE_FAST, OUTLINE:",
                  "handled OUTLINE_CARDINAL border style"
              )
          ])

          # File.getContent resolves to js.html.File on the JS target. Use embedded
          # OpenFL assets on web and the filesystem only on sys targets.
          patch_file("source/backend/Paths.hx", [
              (
                  "spriteJson = File.getContent(spriteJson);",
                  "#if sys\\n\\t\\t\\tspriteJson = sys.io.File.getContent(spriteJson);\\n\\t\\t\\t#else\\n\\t\\t\\tspriteJson = OpenFlAssets.getText(spriteJson);\\n\\t\\t\\t#end",
                  "made sprite JSON loading web-compatible"
              ),
              (
                  "animationJson = File.getContent(animationJson);",
                  "#if sys\\n\\t\\t\\tanimationJson = sys.io.File.getContent(animationJson);\\n\\t\\t\\t#else\\n\\t\\t\\tanimationJson = OpenFlAssets.getText(animationJson);\\n\\t\\t\\t#end",
                  "made animation JSON loading web-compatible"
              )
          ])

          # FlxAnimate's path-based atlas helper contains filesystem calls that
          # must be replaced with OpenFL's embedded-asset reader on HTML5.
          patch_file(".haxelib/flxanimate/git/flxanimate/FlxAnimate.hx", [
              (
                  "if(trimmed == '.json') myJson = sys.io.File.getContent(myJson); //is a path",
                  "if(trimmed == '.json') {\\n\\t\\t\\t#if sys\\n\\t\\t\\tmyJson = sys.io.File.getContent(myJson);\\n\\t\\t\\t#else\\n\\t\\t\\tmyJson = openfl.Assets.getText(myJson);\\n\\t\\t\\t#end\\n\\t\\t}",
                  "guarded FlxAnimate JSON filesystem access"
              ),
              (
                  "myData = sys.io.File.getContent(pathOrStr);",
                  "#if sys\\n\\t\\t\\tmyData = sys.io.File.getContent(pathOrStr);\\n\\t\\t\\t#else\\n\\t\\t\\tmyData = openfl.Assets.getText(pathOrStr);\\n\\t\\t\\t#end",
                  "guarded FlxAnimate data filesystem access"
              )
          ])

          print("Browser compatibility patches applied.")
          PY

      - name: Compile browser target
        working-directory: engine
        run: |
          haxelib run lime build Project.xml html5 -release

      - name: Check browser output
        run: |
          test -f engine/export/release/html5/bin/index.html
          find engine/export/release/html5/bin -maxdepth 2 -type f | head -80
          du -sh engine/export/release/html5/bin

      - name: Upload HTML5 engine test
        uses: actions/upload-artifact@v4
        with:
          name: psych-engine-html5-base
          path: engine/export/release/html5/bin/
          if-no-files-found: error
          retention-days: 14
