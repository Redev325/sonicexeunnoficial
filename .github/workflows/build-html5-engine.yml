name: Build HTML5 engine base
run-name: Build HTML5 engine base

on:
  push:
    paths:
      - ".github/workflows/build-html5-engine.yml"
      - "patches/apply_main_menu.py"
      - "patches/apply_title_screen.py"
      - "patches/SonicEXESettingsState.hx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-html5:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libvlc-dev libvlccore-dev ffmpeg

      - name: Install Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.2.5"

      - name: Fetch open-source Psych Engine HTML5 base
        run: |
          git clone --depth 1 https://github.com/star-studios-official/FNF-PsychEngine-HTML5.git engine
          du -sh engine

      - name: Disable desktop-only Discord integration for web
        working-directory: engine
        run: |
          sed -i 's/<define name="DISCORD_ALLOWED" \/>/<define name="DISCORD_ALLOWED" if="desktop" \/>/' Project.xml
          grep 'DISCORD_ALLOWED' Project.xml

      - name: Install Haxe libraries
        working-directory: engine
        run: |
          haxelib setup "$HOME/haxelib"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("hmm.json")
          data = json.loads(path.read_text())

          # This engine source snapshot is from early 2024. Do not let HMM
          # silently install much newer APIs that this source was not written for.
          pinned = {
              "lime": "8.1.1",
              "openfl": "9.3.2",
              "flixel": "5.5.0",
              "flixel-addons": "3.2.2",
              "flixel-ui": "2.5.0",
          }
          html5_unused = {
              "flixel-tools", "hxCodec", "SScript",
              "hxdiscord_rpc", "linc_luajit",
          }

          kept = []
          for dependency in data["dependencies"]:
              name = dependency["name"]
              if name in html5_unused:
                  continue
              if name in pinned:
                  dependency["version"] = pinned[name]
              kept.append(dependency)

          data["dependencies"] = kept
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("Pinned HTML5 dependencies:")
          for name, version in pinned.items():
              print(f"  {name} {version}")
          print("Skipped desktop-only libraries:", ", ".join(sorted(html5_unused)))
          PY
          haxelib install hxcpp 4.3.2 --quiet
          haxe -cp ./setup -D analyzer-optimize -main Main --interp
          haxelib list

      - name: Patch browser compatibility in Psych Engine
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch_file(path_text, replacements):
              path = Path(path_text)
              if not path.is_file():
                  raise SystemExit(f"Expected source file was not found: {path}")
              source = path.read_text()
              for replacement in replacements:
                  old, new, description = replacement[:3]
                  expected = replacement[3] if len(replacement) > 3 else 1
                  count = source.count(old)
                  if count != expected:
                      raise SystemExit(
                          f"{path}: expected {expected} match(es) for {description}, found {count}"
                      )
                  source = source.replace(old, new)
              path.write_text(source)
              print(f"Patched {path}")

          # The Character Editor's directory scan is only supported on sys targets.
          # In the browser build the built-in character list remains available.
          patch_file("source/states/editors/CharacterEditorState.hx", [
              (
                  "var foldersToCheck:Array<String> = Mods.directoriesWithFile(Paths.getSharedPath(), 'characters/');\n\t\tfor (folder in foldersToCheck)\n\t\t\tfor (file in FileSystem.readDirectory(folder))\n\t\t\t\tif(file.toLowerCase().endsWith('.json'))\n\t\t\t\t{\n\t\t\t\t\tvar charToCheck:String = file.substr(0, file.length - 5);\n\t\t\t\t\tif(!characterList.contains(charToCheck))\n\t\t\t\t\t\tcharacterList.push(charToCheck);\n\t\t\t\t}",
                  "#if sys\n\t\tvar foldersToCheck:Array<String> = Mods.directoriesWithFile(Paths.getSharedPath(), 'characters/');\n\t\tfor (folder in foldersToCheck)\n\t\t\tfor (file in FileSystem.readDirectory(folder))\n\t\t\t\tif(file.toLowerCase().endsWith('.json'))\n\t\t\t\t{\n\t\t\t\t\tvar charToCheck:String = file.substr(0, file.length - 5);\n\t\t\t\t\tif(!characterList.contains(charToCheck))\n\t\t\t\t\t\tcharacterList.push(charToCheck);\n\t\t\t\t}\n\t\t#end",
                  "guarded editor filesystem scan for HTML5"
              )
          ])

          # Resolve the local Psych Engine options.Option explicitly.
          # Without this, the wildcard imports and haxelib classes can shadow it
          # during Haxe's JS target type resolution.
          for options_file in (
              "source/options/GraphicsSettingsSubState.hx",
              "source/options/VisualsUISubState.hx",
              "source/options/GameplaySettingsSubState.hx",
          ):
              patch_file(options_file, [
                  (
                      "package options;\n",
                      "package options;\n\nimport options.Option;\n",
                      "explicitly imported Psych Engine Option type"
                  )
              ])

          # FlxG.error is not available in the web target; the logger is.
          patch_file("source/backend/CoolUtil.hx", [
              (
                  "FlxG.error(\"Platform is not supported for CoolUtil.openFolder\");",
                  "FlxG.log.error(\"Platform is not supported for CoolUtil.openFolder\");",
                  "used cross-target FlxG logger"
              )
          ])

          # File.getContent resolves to js.html.File on the JS target. Use embedded
          # OpenFL assets on web and the filesystem only on sys targets.
          patch_file("source/backend/Paths.hx", [
              (
                  "spriteJson = File.getContent(spriteJson);",
                  "#if sys\n\t\t\tspriteJson = sys.io.File.getContent(spriteJson);\n\t\t\t#else\n\t\t\tspriteJson = OpenFlAssets.getText(spriteJson);\n\t\t\t#end",
                  "made sprite JSON loading web-compatible"
              ),
              (
                  "animationJson = File.getContent(animationJson);",
                  "#if sys\n\t\t\tanimationJson = sys.io.File.getContent(animationJson);\n\t\t\t#else\n\t\t\tanimationJson = OpenFlAssets.getText(animationJson);\n\t\t\t#end",
                  "made animation JSON loading web-compatible"
              )
          ])

          # FlxAnimate's path-based atlas helper contains filesystem calls that
          # must be replaced with OpenFL's embedded-asset reader on HTML5.
          patch_file(".haxelib/flxanimate/git/flxanimate/FlxAnimate.hx", [
              (
                  "if(trimmed == '.json') myJson = sys.io.File.getContent(myJson); //is a path",
                  "if(trimmed == '.json') {\n\t\t\t#if sys\n\t\t\tmyJson = sys.io.File.getContent(myJson);\n\t\t\t#else\n\t\t\tmyJson = openfl.Assets.getText(myJson);\n\t\t\t#end\n\t\t}",
                  "guarded FlxAnimate JSON filesystem access"
              ),
              (
                  "myData = sys.io.File.getContent(pathOrStr);",
                  "#if sys\n\t\t\tmyData = sys.io.File.getContent(pathOrStr);\n\t\t\t#else\n\t\t\tmyData = openfl.Assets.getText(pathOrStr);\n\t\t\t#end",
                  "guarded FlxAnimate data filesystem access",
                  2
              )
          ])

          # HaxeFlixel 6 moved FlxSound from flixel.system to flixel.sound.
          # Also import ClickStuff explicitly: it is a secondary type in FlxAnim.hx.
          patch_file(".haxelib/flxanimate/git/flxanimate/FlxAnimate.hx", [
              (
                  "import flixel.system.FlxSound;",
                  "import flixel.sound.FlxSound;",
                  "updated FlxAnimate FlxSound import"
              ),
              (
                  "import flxanimate.animate.FlxAnim;",
                  "import flxanimate.animate.FlxAnim;\nimport flxanimate.animate.FlxAnim.ClickStuff;",
                  "imported the ClickStuff typedef"
              )
          ])

          patch_file(".haxelib/flxanimate/git/flxanimate/animate/FlxAnim.hx", [
              (
                  "import flixel.system.FlxSound;",
                  "import flixel.sound.FlxSound;",
                  "updated FlxAnim FlxSound import"
              )
          ])

          # The FlxAnimate button event also imports FlxSound from the old package.
          patch_file(".haxelib/flxanimate/git/flxanimate/animate/ButtonEvent.hx", [
              (
                  "import flixel.system.FlxSound;",
                  "import flixel.sound.FlxSound;",
                  "updated ButtonEvent FlxSound import"
              )
          ])

          # The HTML5 filter renderer uses Lime's internal canvas bridge.
          patch_file(".haxelib/flxanimate/git/flxanimate/display/FlxAnimateFilterRenderer.hx", [
              (
                  "import flixel.FlxG;",
                  "import flixel.FlxG;\nimport lime._internal.graphics.ImageCanvasUtil;",
                  "imported Lime ImageCanvasUtil"
              ),
              (
                  "@:access(openfl.display.CairoRenderer)",
                  "@:access(openfl.display.CairoRenderer)\n@:access(lime.graphics.ImageBuffer)",
                  "granted access to the Lime canvas context"
              )
          ])

          print("Browser compatibility patches applied.")
          PY

      - name: Fetch original Sonic.EXE menu assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package engine/assets/shared/images/sonicexe-menu/options
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > release.zip
          rm -f unofficial-windows.1.zip.001 unofficial-windows.1.zip.002
          cd ..
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageEnhance, ImageOps
          import shutil

          archive = Path("package/release.zip")
          images = {
              "assets/exe/mainmenu/logo.webp": Path("engine/assets/shared/images/sonicexe-logo.png"),
              "assets/exe/mainmenu/options/box.webp": Path("engine/assets/shared/images/sonicexe-menu/options/box.png"),
              "assets/exe/mainmenu/options/shadow.webp": Path("engine/assets/shared/images/sonicexe-menu/options/shadow.png"),
              "assets/exe/mainmenu/options/hitbox.webp": Path("engine/assets/shared/images/sonicexe-menu/options/hitbox.png"),
              "assets/exe/backButton.webp": Path("engine/assets/shared/images/sonicexe-back-button.png"),
          }
          with ZipFile(archive) as z:
              for source_name, output in images.items():
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(source_name) as source, Image.open(source) as image:
                      image.convert("RGBA").save(output, format="PNG", optimize=True)
                  print(f"Prepared original menu sprite: {output} ({output.stat().st_size:,} bytes)")

              # Retain the original purple frame for the selected option and create a gray idle version.
              # Keep its dimensions and alpha channel exactly aligned with the original.
              box_source = Path("engine/assets/shared/images/sonicexe-menu/options/box.png")
              idle_box_output = Path("engine/assets/shared/images/sonicexe-menu/options/box-idle.png")
              with Image.open(box_source) as box_image:
                  rgba = box_image.convert("RGBA")
                  alpha = rgba.getchannel("A")
                  gray = ImageOps.grayscale(rgba.convert("RGB"))
                  gray = ImageEnhance.Brightness(gray).enhance(1.45)
                  gray = ImageEnhance.Contrast(gray).enhance(0.82)
                  idle_box = Image.merge("RGBA", (gray, gray, gray, alpha))
                  idle_box.save(idle_box_output, format="PNG", optimize=True)
              print(f"Prepared neutral gray idle frame: {idle_box_output} ({idle_box_output.stat().st_size:,} bytes)")

              # Copy original title-screen assets and matching atlas metadata.
              title_prefix = "assets/exe/title/"
              for name in z.namelist():
                  if not name.startswith(title_prefix) or name.endswith("/"):
                      continue
                  suffix = Path(name).suffix.casefold()
                  if suffix not in {".webp", ".xml", ".json"}:
                      continue
                  relative = Path(name[len(title_prefix):])
                  destination = Path("engine/assets/shared/images/sonicexe-title") / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if suffix == ".webp":
                      with z.open(name) as source, Image.open(source) as image:
                          destination = destination.with_suffix(".png")
                          image.convert("RGBA").save(destination, format="PNG", optimize=True)
                  else:
                      with z.open(name) as source, destination.open("wb") as target:
                          shutil.copyfileobj(source, target)
                  print(f"Prepared original title asset: {destination} ({destination.stat().st_size:,} bytes)")

              # Original red settings background, heading, category bars, and arrows.
              options_prefix = "assets/exe/options/"
              options_output = Path("engine/assets/shared/images/sonicexe-options")
              for name in z.namelist():
                  if not name.startswith(options_prefix) or name.endswith("/"):
                      continue
                  if Path(name).suffix.casefold() != ".webp":
                      continue
                  destination = options_output / (Path(name[len(options_prefix):]).stem + ".png")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(name) as source, Image.open(source) as image:
                      image.convert("RGBA").save(destination, format="PNG", optimize=True)
                  print(f"Prepared original settings artwork: {destination} ({destination.stat().st_size:,} bytes)")

              # The original head.webp is the Sonic silhouette transition mask.
              # Preserve its alpha exactly and tint the opaque pixels red for the wipe.
              transition_output = Path("engine/assets/shared/images/sonicexe-transitions/head-red.png")
              transition_output.parent.mkdir(parents=True, exist_ok=True)
              with z.open("assets/exe/transitions/head.webp") as source, Image.open(source) as image:
                  transition_rgba = image.convert("RGBA")
                  red_mask = Image.new("RGBA", transition_rgba.size, (235, 0, 0, 255))
                  red_mask.putalpha(transition_rgba.getchannel("A"))
                  red_mask.save(transition_output, format="PNG", optimize=True)
              print(f"Prepared original Sonic head red transition: {transition_output}")

              font_files = (
                  "vcr.ttf", "pixel-latin.ttf", "NiseSega.ttf", "NiseSegaSonic.TTF",
                  "SonicFont.ttf", "SonicCD.ttf", "sonic4.ttf", "sonichud.ttf",
                  "Plaza Regular.ttf", "fps.ttf",
              )
              font_dir = Path("engine/assets/fonts")
              font_dir.mkdir(parents=True, exist_ok=True)
              for font_name in font_files:
                  output = font_dir / font_name
                  with z.open("assets/fonts/" + font_name) as source, output.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  print(f"Installed original game font: {output} ({output.stat().st_size:,} bytes)")

              music_output = Path("engine/assets/shared/music/menu-source.ogg")
              music_output.parent.mkdir(parents=True, exist_ok=True)
              with z.open("assets/exe/music/menu.ogg") as source, music_output.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted original menu music source ({music_output.stat().st_size:,} bytes)")

              video_output = Path("engine/sonicexe-menu.mp4")
              with z.open("assets/exe/mainmenu/menu.mp4") as source, video_output.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Prepared original animated menu background ({video_output.stat().st_size:,} bytes)")

              post_intro_source = Path("engine/postIntro-source.mp4")
              with z.open("assets/videos/postIntro.mp4") as source, post_intro_source.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted original postIntro video ({post_intro_source.stat().st_size:,} bytes)")

              title_bg_source = Path("engine/sonicexe-title-bg.mp4")
              with z.open("assets/exe/title/statictitlemenu.mp4") as source, title_bg_source.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted original animated title background ({title_bg_source.stat().st_size:,} bytes)")
          PY
          rm -rf package

      - name: Convert original game menu music for HTML5
        run: |
          ffmpeg -y -i engine/assets/shared/music/menu-source.ogg -vn -c:a libmp3lame -q:a 2 engine/assets/shared/music/menu.mp3
          rm -f engine/assets/shared/music/menu-source.ogg
          test -s engine/assets/shared/music/menu.mp3
          echo "Prepared original menu.mp3 for the HTML5-only asset library."

      - name: Convert original postIntro video for HTML5 playback
        run: |
          ffmpeg -y -i engine/postIntro-source.mp4 \
            -c:v libx264 -preset veryfast -crf 21 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart engine/postIntro.mp4
          rm -f engine/postIntro-source.mp4
          test -s engine/postIntro.mp4
          echo "Checking that the converted postIntro video contains audio:"
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,channels,sample_rate -of default=noprint_wrappers=1 engine/postIntro.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 engine/postIntro.mp4 | grep -q .
          ffprobe -v error -show_entries format=duration -of csv=p=0 engine/postIntro.mp4

      - name: Apply original Sonic.EXE title and intro artwork
        run: |
          python3 patches/apply_title_screen.py engine/source/states/TitleState.hx

      - name: Apply original browser main menu layout
        run: |
          python3 patches/apply_main_menu.py engine/source/states/MainMenuState.hx

      - name: Install custom Sonic.EXE settings category screen
        run: |
          mkdir -p engine/source/states
          cp patches/SonicEXESettingsState.hx engine/source/states/SonicEXESettingsState.hx
          test -s engine/source/states/SonicEXESettingsState.hx

      - name: Compile browser target
        working-directory: engine
        run: |
          haxelib run lime build Project.xml html5 -release

      - name: Check browser output
        run: |
          test -f engine/export/release/html5/bin/index.html
          find engine/export/release/html5/bin -maxdepth 2 -type f | head -80
          du -sh engine/export/release/html5/bin

      - name: Add original animated menu video to the HTML5 page
        run: |
          output="engine/export/release/html5/bin"
          cp engine/sonicexe-menu.mp4 "$output/sonicexe-menu.mp4"
          cp engine/sonicexe-title-bg.mp4 "$output/sonicexe-title-bg.mp4"
          cp engine/assets/shared/images/sonicexe-title/spikesdown.png "$output/sonicexe-title-spikes.png"
          cp engine/postIntro.mp4 "$output/postIntro.mp4"
          test -s "$output/postIntro.mp4"
          test -s "$output/sonicexe-title-bg.mp4"
          test -s "$output/sonicexe-title-spikes.png"
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path("engine/export/release/html5/bin/index.html")
          html = page.read_text(encoding="utf-8")

          head_markup = """
          <style id="sonicexe-menu-video-style">
            html, body { position: relative; width: 100%; height: 100%; background: #000; }
            #sonicexe-menu-bg {
              position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
              object-fit: contain; display: none; z-index: 0;
              pointer-events: none;
            }
            /* The OpenFL canvas clears to black on some HTML5 browsers even when
               FlxG.camera.bgColor is transparent. Blend the complete game layer
               over the actual Sonic.EXE MP4 so black clear pixels reveal the video. */
            #openfl-content {
              position: relative; z-index: 1; width: 100%; height: 100%;
              background: transparent !important;
              mix-blend-mode: screen;
            }
            #openfl-content canvas {
              background: transparent !important;
            }
            #sonicexe-postintro-video {
              position: fixed; inset: 0; width: 100vw; height: 100vh;
              object-fit: contain; display: none; z-index: 5;
              background: #000; pointer-events: none;
            }
            #sonicexe-title-bg {
              position: fixed; inset: 0; width: 100vw; height: 100vh;
              object-fit: cover; display: none; z-index: 2;
              pointer-events: none; mix-blend-mode: screen;
            }
            /* Original black spikes rise from the bottom edge of the title screen.
               Keep this separate from the blended title video so their black pixels
               remain visible against the animated background. */
            #sonicexe-title-spikes {
              position: fixed; left: 0; bottom: -12.8vh; width: 100vw; height: auto;
              display: none; z-index: 4; pointer-events: none;
              animation: sonicexe-title-spikes-rise 1.25s ease-in-out infinite alternate;
            }
            @keyframes sonicexe-title-spikes-rise {
              from { bottom: -12.8vh; }
              to { bottom: -11.2vh; }
            }
          </style>
          <script>
            window.sonicEXEPostIntroFinished = true;
            window.setSonicEXEPostIntro = function(show) {
              var video = document.getElementById("sonicexe-postintro-video");
              if (!video) {
                window.sonicEXEPostIntroFinished = true;
                return;
              }
              if (show) {
                window.sonicEXEPostIntroFinished = false;
                video.currentTime = 0;
                // Keep autoplay-compatible mute only until the first real user gesture.
                var audioUnlocked = window.sonicEXEAudioUnlocked === true;
                video.defaultMuted = !audioUnlocked;
                video.muted = !audioUnlocked;
                if (audioUnlocked) video.removeAttribute("muted");
                video.volume = 1;
                video.style.display = "block";
                var playPromise = video.play();
                if (playPromise && playPromise.catch) {
                  playPromise.catch(function() {
                    // A previous gesture may no longer count as an autoplay gesture.
                    // Fall back to muted playback instead of dropping the cutscene.
                    if (!video.muted) {
                      video.defaultMuted = true;
                      video.muted = true;
                      video.setAttribute("muted", "");
                      var retryPromise = video.play();
                      if (retryPromise && retryPromise.catch) retryPromise.catch(function() {});
                    } else {
                      window.sonicEXEPostIntroFinished = true;
                      video.style.display = "none";
                    }
                  });
                }
              } else {
                video.pause();
                video.style.display = "none";
              }
            };
            // This script is in <head>, before the video element is parsed.
            // Install gesture handlers now, then bind video events after DOMContentLoaded.
            window.sonicEXEAudioUnlocked = false;
            window.unlockSonicEXEAudio = function() {
              window.sonicEXEAudioUnlocked = true;
              var video = document.getElementById("sonicexe-postintro-video");
              if (!video) return;
              video.defaultMuted = false;
              video.muted = false;
              video.removeAttribute("muted");
              video.volume = 1;
              // Calling play() from the gesture lets browsers resume the audio track.
              if (!video.paused) {
                var resumePromise = video.play();
                if (resumePromise && resumePromise.catch) resumePromise.catch(function() {});
              }
            };
            ["pointerdown", "touchstart", "keydown"].forEach(function(eventName) {
              window.addEventListener(eventName, window.unlockSonicEXEAudio, {
                capture: true,
                passive: true
              });
            });
            window.addEventListener("DOMContentLoaded", function() {
              var video = document.getElementById("sonicexe-postintro-video");
              if (!video) return;
              video.addEventListener("ended", function() {
                window.sonicEXEPostIntroFinished = true;
              });
              video.addEventListener("error", function() {
                window.sonicEXEPostIntroFinished = true;
              });
              video.addEventListener("loadedmetadata", function() {
                if (window.sonicEXEAudioUnlocked) {
                  video.defaultMuted = false;
                  video.muted = false;
                  video.removeAttribute("muted");
                  video.volume = 1;
                }
              });
            });
            window.setSonicEXETitleVideo = function(show) {
              var video = document.getElementById("sonicexe-title-bg");
              var spikes = document.getElementById("sonicexe-title-spikes");
              if (spikes) spikes.style.display = show ? "block" : "none";
              if (!video) return;
              video.style.display = show ? "block" : "none";
              if (show) {
                var menuVideo = document.getElementById("sonicexe-menu-bg");
                if (menuVideo) { menuVideo.pause(); menuVideo.style.display = "none"; }
                var playPromise = video.play();
                if (playPromise && playPromise.catch) playPromise.catch(function() {});
              } else {
                video.pause();
              }
            };
            window.setSonicEXEMenuVideo = function(show) {
              var video = document.getElementById("sonicexe-menu-bg");
              var titleSpikes = document.getElementById("sonicexe-title-spikes");
              if (show && titleSpikes) titleSpikes.style.display = "none";
              if (!video) return;
              video.style.display = show ? "block" : "none";
              if (show) {
                var titleVideo = document.getElementById("sonicexe-title-bg");
                if (titleVideo) { titleVideo.pause(); titleVideo.style.display = "none"; }
                var playPromise = video.play();
                if (playPromise && playPromise.catch) playPromise.catch(function() {});
              } else {
                video.pause();
              }
            };
          </script>
          """
          body_markup = """
          <video id="sonicexe-menu-bg" muted loop playsinline preload="auto" aria-hidden="true">
            <source src="sonicexe-menu.mp4" type="video/mp4">
          </video>
          <video id="sonicexe-title-bg" muted loop playsinline preload="auto" aria-hidden="true">
            <source src="sonicexe-title-bg.mp4" type="video/mp4">
          </video>
          <img id="sonicexe-title-spikes" src="sonicexe-title-spikes.png" alt="" aria-hidden="true">
          <video id="sonicexe-postintro-video" muted playsinline preload="auto" aria-hidden="true">
            <source src="postIntro.mp4" type="video/mp4">
          </video>
          """

          if "sonicexe-menu-bg" in html:
              raise SystemExit("The Sonic.EXE menu video was already injected.")
          head_end = html.lower().rfind("</head>")
          body = re.search(r"<body\b[^>]*>", html, re.IGNORECASE)
          if head_end < 0 or not body:
              raise SystemExit("Unexpected generated HTML5 index.html structure.")
          # Apply these overrides after OpenFL's own stylesheet.
          html = html[:head_end] + "\n" + head_markup + "\n" + html[head_end:]
          body = re.search(r"<body\b[^>]*>", html, re.IGNORECASE)
          if not body:
              raise SystemExit("Generated HTML5 page has no body tag after head injection.")
          html = html[:body.end()] + "\n" + body_markup + html[body.end():]
          page.write_text(html, encoding="utf-8")
          print("Installed the original menu MP4 behind the transparent game canvas.")
