      - name: Optimize menu and title videos for faster browser streaming
        run: |
          convert_video() {
            source="$1"
            output="$2"
            optimized="${output%.mp4}.optimized.mp4"
            test -s "$source"
            ffmpeg -y -i "$source" -map 0:v:0 -map '0:a?' \
              -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p \
              -c:a aac -b:a 128k -movflags +faststart "$optimized"
            test -s "$optimized"
            source_bytes="$(stat -c%s "$source")"
            optimized_bytes="$(stat -c%s "$optimized")"
            # Keep the browser-friendly encode if it is no more than 5% larger;
            # otherwise preserve the original rather than increasing download size.
            if [ "$optimized_bytes" -le "$((source_bytes + source_bytes / 20))" ]; then
              mv "$optimized" "$output"
              echo "Optimized $output: $source_bytes -> $optimized_bytes bytes"
            else
              cp "$source" "$output"
              rm -f "$optimized"
              echo "Kept original $source (optimized version was larger)."
            fi
          }
          convert_video engine/sonicexe-menu-source.mp4 engine/sonicexe-menu.mp4
          convert_video engine/sonicexe-title-bg-source.mp4 engine/sonicexe-title-bg.mp4
          rm -f engine/sonicexe-menu-source.mp4 engine/sonicexe-title-bg-source.mp4
          test -s engine/sonicexe-menu.mp4
          test -s engine/sonicexe-title-bg.mp4

