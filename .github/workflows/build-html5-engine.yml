name: Build HTML5 engine base
run-name: Build HTML5 engine base

on:
  push:
    paths:
      - ".github/workflows/build-html5-engine.yml"
      - "patches/apply_main_menu.py"
      - "patches/apply_title_screen.py"
      - "patches/SonicEXESettingsState.hx"
      - "patches/apply_soundtest_backgrounds.py"
      - "patches/apply_sonic_transition.py"
      - "patches/apply_menu_screen_uis.py"
      - "patches/apply_custom_options_ui.py"
      - "patches/apply_loading_optimization.py"
      - "patches/apply_menu_freeze_fixes.py"
      - "patches/apply_psych_engine_credits.py"
      - "patches/SonicEXEAssetLoader.hx"
      - "patches/apply_runtime_diagnostics.py"
      - "patches/import_sonicexe_song_data.py"
      - "patches/apply_sonicexe_freeplay_ui.py"
      - "patches/apply_sonicexe_freeplay_menu.py"
      - "patches/apply_sonicexe_story_menu.py"
      - "patches/inject_runtime_diagnostics.py"
  workflow_dispatch:

# Trigger a full rebuild against the latest committed asset and intro pipeline.
# Keep only the newest pending build for this branch; don't interrupt a build
# that has already started compiling.
concurrency:
  group: sonicexe-html5-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-html5:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      # The build's Node toolchain is pinned explicitly rather than inherited from the runner.
# Keep the new intro and streaming optimizations on the build's latest main revision.
      - name: Set up Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Verify Node.js runtime
        run: |
          node --version
          node -e "if (process.versions.node.split('.')[0] !== '26') process.exit(1)"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libvlc-dev libvlccore-dev ffmpeg

      - name: Install Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.2.5"

      - name: Fetch open-source Psych Engine HTML5 base
        run: |
          git clone --depth 1 https://github.com/star-studios-official/FNF-PsychEngine-HTML5.git engine
          du -sh engine

      - name: Disable desktop-only Discord integration for web
        working-directory: engine
        run: |
          sed -i 's/<define name="DISCORD_ALLOWED" \/>/<define name="DISCORD_ALLOWED" if="desktop" \/>/' Project.xml
          grep 'DISCORD_ALLOWED' Project.xml

      - name: Install Haxe libraries
        working-directory: engine
        run: |
          haxelib setup "$HOME/haxelib"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("hmm.json")
          data = json.loads(path.read_text())

          # This engine source snapshot is from early 2024. Do not let HMM
          # silently install much newer APIs that this source was not written for.
          pinned = {
              "lime": "8.1.1",
              "openfl": "9.3.2",
              "flixel": "5.5.0",
              "flixel-addons": "3.2.2",
              "flixel-ui": "2.5.0",
          }
          html5_unused = {
              "flixel-tools", "hxCodec", "SScript",
              "hxdiscord_rpc", "linc_luajit",
          }

          kept = []
          for dependency in data["dependencies"]:
              name = dependency["name"]
              if name in html5_unused:
                  continue
              if name in pinned:
                  dependency["version"] = pinned[name]
              kept.append(dependency)

          data["dependencies"] = kept
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("Pinned HTML5 dependencies:")
          for name, version in pinned.items():
              print(f"  {name} {version}")
          print("Skipped desktop-only libraries:", ", ".join(sorted(html5_unused)))
          PY
          haxelib install hxcpp 4.3.2 --quiet
          haxe -cp ./setup -D analyzer-optimize -main Main --interp
          haxelib list

      - name: Patch browser compatibility in Psych Engine
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch_file(path_text, replacements):
              path = Path(path_text)
              if not path.is_file():
                  raise SystemExit(f"Expected source file was not found: {path}")
              source = path.read_text()
              for replacement in replacements:
                  old, new, description = replacement[:3]
                  expected = replacement[3] if len(replacement) > 3 else 1
                  count = source.count(old)
                  if count != expected:
                      raise SystemExit(
                          f"{path}: expected {expected} match(es) for {description}, found {count}"
                      )
                  source = source.replace(old, new)
              path.write_text(source)
              print(f"Patched {path}")

          # The Character Editor's directory scan is only supported on sys targets.
          # In the browser build the built-in character list remains available.
          patch_file("source/states/editors/CharacterEditorState.hx", [
              (
                  "var foldersToCheck:Array<String> = Mods.directoriesWithFile(Paths.getSharedPath(), 'characters/');\n\t\tfor (folder in foldersToCheck)\n\t\t\tfor (file in FileSystem.readDirectory(folder))\n\t\t\t\tif(file.toLowerCase().endsWith('.json'))\n\t\t\t\t{\n\t\t\t\t\tvar charToCheck:String = file.substr(0, file.length - 5);\n\t\t\t\t\tif(!characterList.contains(charToCheck))\n\t\t\t\t\t\tcharacterList.push(charToCheck);\n\t\t\t\t}",
                  "#if sys\n\t\tvar foldersToCheck:Array<String> = Mods.directoriesWithFile(Paths.getSharedPath(), 'characters/');\n\t\tfor (folder in foldersToCheck)\n\t\t\tfor (file in FileSystem.readDirectory(folder))\n\t\t\t\tif(file.toLowerCase().endsWith('.json'))\n\t\t\t\t{\n\t\t\t\t\tvar charToCheck:String = file.substr(0, file.length - 5);\n\t\t\t\t\tif(!characterList.contains(charToCheck))\n\t\t\t\t\t\tcharacterList.push(charToCheck);\n\t\t\t\t}\n\t\t#end",
                  "guarded editor filesystem scan for HTML5"
              )
          ])

          # Resolve the local Psych Engine options.Option explicitly.
          # Without this, the wildcard imports and haxelib classes can shadow it
          # during Haxe's JS target type resolution.
          for options_file in (
              "source/options/GraphicsSettingsSubState.hx",
              "source/options/VisualsUISubState.hx",
              "source/options/GameplaySettingsSubState.hx",
          ):
              patch_file(options_file, [
                  (
                      "package options;\n",
                      "package options;\n\nimport options.Option;\n",
                      "explicitly imported Psych Engine Option type"
                  )
              ])

          # FlxG.error is not available in the web target; the logger is.
          patch_file("source/backend/CoolUtil.hx", [
              (
                  "FlxG.error(\"Platform is not supported for CoolUtil.openFolder\");",
                  "FlxG.log.error(\"Platform is not supported for CoolUtil.openFolder\");",
                  "used cross-target FlxG logger"
              )
          ])

          # File.getContent resolves to js.html.File on the JS target. Use embedded
          # OpenFL assets on web and the filesystem only on sys targets.
          patch_file("source/backend/Paths.hx", [
              (
                  "spriteJson = File.getContent(spriteJson);",
                  "#if sys\n\t\t\tspriteJson = sys.io.File.getContent(spriteJson);\n\t\t\t#else\n\t\t\tspriteJson = OpenFlAssets.getText(spriteJson);\n\t\t\t#end",
                  "made sprite JSON loading web-compatible"
              ),
              (
                  "animationJson = File.getContent(animationJson);",
                  "#if sys\n\t\t\tanimationJson = sys.io.File.getContent(animationJson);\n\t\t\t#else\n\t\t\tanimationJson = OpenFlAssets.getText(animationJson);\n\t\t\t#end",
                  "made animation JSON loading web-compatible"
              )
          ])

          # FlxAnimate's path-based atlas helper contains filesystem calls that
          # must be replaced with OpenFL's embedded-asset reader on HTML5.
          patch_file(".haxelib/flxanimate/git/flxanimate/FlxAnimate.hx", [
              (
                  "if(trimmed == '.json') myJson = sys.io.File.getContent(myJson); //is a path",
                  "if(trimmed == '.json') {\n\t\t\t#if sys\n\t\t\tmyJson = sys.io.File.getContent(myJson);\n\t\t\t#else\n\t\t\tmyJson = openfl.Assets.getText(myJson);\n\t\t\t#end\n\t\t}",
                  "guarded FlxAnimate JSON filesystem access"
              ),
              (
                  "myData = sys.io.File.getContent(pathOrStr);",
                  "#if sys\n\t\t\tmyData = sys.io.File.getContent(pathOrStr);\n\t\t\t#else\n\t\t\tmyData = openfl.Assets.getText(pathOrStr);\n\t\t\t#end",
                  "guarded FlxAnimate data filesystem access",
                  2
              )
          ])

          # HaxeFlixel 6 moved FlxSound from flixel.system to flixel.sound.
          # Also import ClickStuff explicitly: it is a secondary type in FlxAnim.hx.
          patch_file(".haxelib/flxanimate/git/flxanimate/FlxAnimate.hx", [
              (
                  "import flixel.system.FlxSound;",
                  "import flixel.sound.FlxSound;",
                  "updated FlxAnimate FlxSound import"
              ),
              (
                  "import flxanimate.animate.FlxAnim;",
                  "import flxanimate.animate.FlxAnim;\nimport flxanimate.animate.FlxAnim.ClickStuff;",
                  "imported the ClickStuff typedef"
              )
          ])

          patch_file(".haxelib/flxanimate/git/flxanimate/animate/FlxAnim.hx", [
              (
                  "import flixel.system.FlxSound;",
                  "import flixel.sound.FlxSound;",
                  "updated FlxAnim FlxSound import"
              )
          ])

          # The FlxAnimate button event also imports FlxSound from the old package.
          patch_file(".haxelib/flxanimate/git/flxanimate/animate/ButtonEvent.hx", [
              (
                  "import flixel.system.FlxSound;",
                  "import flixel.sound.FlxSound;",
                  "updated ButtonEvent FlxSound import"
              )
          ])

          # The HTML5 filter renderer uses Lime's internal canvas bridge.
          patch_file(".haxelib/flxanimate/git/flxanimate/display/FlxAnimateFilterRenderer.hx", [
              (
                  "import flixel.FlxG;",
                  "import flixel.FlxG;\nimport lime._internal.graphics.ImageCanvasUtil;",
                  "imported Lime ImageCanvasUtil"
              ),
              (
                  "@:access(openfl.display.CairoRenderer)",
                  "@:access(openfl.display.CairoRenderer)\n@:access(lime.graphics.ImageBuffer)",
                  "granted access to the Lime canvas context"
              )
          ])

          print("Browser compatibility patches applied.")
          PY

      - name: Fetch original Sonic.EXE menu assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p package engine/assets/shared/images/sonicexe-menu/options
          cd package
          gh release download v1.0.0 --repo "$GH_REPO" \
            --pattern 'unofficial-windows.1.zip.001' \
            --pattern 'unofficial-windows.1.zip.002'
          cat unofficial-windows.1.zip.001 unofficial-windows.1.zip.002 > release.zip
          rm -f unofficial-windows.1.zip.001 unofficial-windows.1.zip.002
          cd ..
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image, ImageEnhance, ImageOps
          import shutil
          import re

          archive = Path("package/release.zip")
          images = {
              "assets/exe/mainmenu/logo.webp": Path("engine/assets/shared/images/sonicexe-logo.png"),
              "assets/exe/mainmenu/options/box.webp": Path("engine/assets/shared/images/sonicexe-menu/options/box.png"),
              "assets/exe/mainmenu/options/shadow.webp": Path("engine/assets/shared/images/sonicexe-menu/options/shadow.png"),
              "assets/exe/mainmenu/options/hitbox.webp": Path("engine/assets/shared/images/sonicexe-menu/options/hitbox.png"),
              "assets/exe/backButton.webp": Path("engine/assets/shared/images/sonicexe-back-button.png"),
          }
          with ZipFile(archive) as z:
              note_related = [
                  name for name in z.namelist()
                  if Path(name).suffix.casefold() in {".png", ".webp", ".xml", ".txt"}
                  and (
                      "note_assets" in Path(name).name.casefold()
                      or "noteskins" in name.casefold()
                      or "note-skin" in name.casefold()
                  )
              ]
              print("Original release note-skin candidates:")
              for name in note_related:
                  print("  " + name)
              if not note_related:
                  print("  No explicitly named note-skin files found in release archive.")

              # Install the original game's regular and pixel note sheets as one
              # selectable skin. Psych Engine appends "-sonic.exe" from the
              # saved "Sonic.EXE" preference, including for pixel sustain ends.
              note_skin_dir = Path("engine/assets/shared/images/noteSkins")
              note_skin_dir.mkdir(parents=True, exist_ok=True)
              pixel_note_skin_dir = Path("engine/assets/shared/images/pixelUI/noteSkins")
              pixel_note_skin_dir.mkdir(parents=True, exist_ok=True)
              skin_suffix = "-sonic.exe"

              with z.open("assets/shared/images/noteSkins/NOTE_assets.webp") as source, Image.open(source) as image:
                  image.convert("RGBA").save(note_skin_dir / f"NOTE_assets{skin_suffix}.png", format="PNG", optimize=True)

              with z.open("assets/shared/images/noteSkins/NOTE_assets.xml") as source:
                  atlas_xml = source.read().decode("utf-8-sig")
              atlas_xml, replaced = re.subn(
                  r'imagePath\s*=\s*"[^"]+"',
                  f'imagePath="NOTE_assets{skin_suffix}.png"',
                  atlas_xml,
                  count=1
              )
              if replaced != 1:
                  raise SystemExit("Could not update the original Sonic.EXE note atlas imagePath.")
              (note_skin_dir / f"NOTE_assets{skin_suffix}.xml").write_text(atlas_xml, encoding="utf-8")

              pixel_note_files = (
                  ("assets/shared/images/pixelUI/noteSkins/NOTE_assets.webp", f"NOTE_assets{skin_suffix}.png"),
                  ("assets/shared/images/pixelUI/noteSkins/NOTE_assetsENDS.webp", f"NOTE_assets{skin_suffix}ENDS.png"),
              )
              for source_name, output_name in pixel_note_files:
                  with z.open(source_name) as source, Image.open(source) as image:
                      image.convert("RGBA").save(pixel_note_skin_dir / output_name, format="PNG", optimize=True)

              note_list = note_skin_dir / "list.txt"
              existing_skins = note_list.read_text(encoding="utf-8-sig") if note_list.exists() else ""
              if "sonic.exe" not in {line.strip().casefold() for line in existing_skins.splitlines()}:
                  note_list.write_text(existing_skins.rstrip() + ("\n" if existing_skins.strip() else "") + "Sonic.EXE\n", encoding="utf-8")
              print("Installed original Sonic.EXE note atlases and registered the Sonic.EXE Visuals skin.")
 
              # Install the original Sonic.EXE note-splash atlas as a separate Visuals skin.
              splash_related = [
                  name for name in z.namelist()
                  if Path(name).suffix.casefold() in {".png", ".webp", ".xml", ".txt"}
                  and "notesplash" in re.sub(r"[^a-z0-9]", "", name.casefold())
              ]
              print("Original release note-splash candidates:")
              for name in splash_related:
                  print("  " + name)
              if not splash_related:
                  raise SystemExit("The original release archive contains no note-splash assets.")

              archive_names = {name.casefold(): name for name in z.namelist()}
              splash_images = [
                  name for name in splash_related
                  if Path(name).suffix.casefold() in {".png", ".webp"}
              ]
              splash_pairs = []
              for image_name in splash_images:
                  xml_key = str(Path(image_name).with_suffix(".xml")).casefold()
                  xml_name = archive_names.get(xml_key)
                  if xml_name:
                      splash_pairs.append((image_name, xml_name))
              if not splash_pairs:
                  raise SystemExit("Found note-splash image candidates, but none has a matching Sparrow XML atlas.")

              def splash_score(pair):
                  image_name, _ = pair
                  image_path = Path(image_name)
                  stem = re.sub(r"[^a-z0-9]", "", image_path.stem.casefold())
                  parent = re.sub(r"[^a-z0-9]", "", image_path.parent.name.casefold())
                  score = 0
                  if stem == "notesplashes":
                      score += 100
                  elif stem == "notesplash":
                      score += 70
                  elif "notesplash" in stem:
                      score += 30
                  if parent in {"notesplashes", "notesplash"}:
                      score += 35
                  if "shared" in {part.casefold() for part in image_path.parts}:
                      score += 10
                  if image_path.suffix.casefold() == ".webp":
                      score += 1
                  return score

              splash_image_name, splash_xml_name = max(splash_pairs, key=splash_score)
              splash_dir = Path("engine/assets/shared/images/noteSplashes")
              splash_dir.mkdir(parents=True, exist_ok=True)
              splash_base = "noteSplashes-sonic.exe"
              splash_image_output = splash_dir / f"{splash_base}.png"
              with z.open(splash_image_name) as source, Image.open(source) as image:
                  image.convert("RGBA").save(splash_image_output, format="PNG", optimize=True)

              with z.open(splash_xml_name) as source:
                  splash_xml = source.read().decode("utf-8-sig")
              splash_xml, splash_replaced = re.subn(
                  r'imagePath\s*=\s*"[^"]+"',
                  f'imagePath="{splash_base}.png"',
                  splash_xml,
                  count=1
              )
              if splash_replaced != 1:
                  raise SystemExit(f"Could not update the note-splash atlas imagePath in {splash_xml_name}.")
              (splash_dir / f"{splash_base}.xml").write_text(splash_xml, encoding="utf-8")

              # Psych Engine reads an optional same-name text file for animation
              # prefix, playback-rate range and per-direction offsets.
              splash_config_candidates = [
                  name for name in splash_related
                  if Path(name).suffix.casefold() == ".txt"
                  and Path(name).parent == Path(splash_image_name).parent
              ]
              exact_config = archive_names.get(str(Path(splash_image_name).with_suffix(".txt")).casefold())
              if exact_config:
                  splash_config_source = exact_config
              else:
                  splash_config_source = next(
                      (name for name in splash_config_candidates
                       if re.sub(r"[^a-z0-9]", "", Path(name).stem.casefold()) == "notesplashes"),
                      splash_config_candidates[0] if len(splash_config_candidates) == 1 else None
                  )
              if splash_config_source:
                  (splash_dir / f"{splash_base}.txt").write_bytes(z.read(splash_config_source))
                  print(f"Installed note-splash animation config: {splash_config_source}")
              else:
                  print("No matching note-splash config found; using Psych Engine's default animation rate and offsets.")

              splash_list = splash_dir / "list.txt"
              existing_splash_skins = splash_list.read_text(encoding="utf-8-sig") if splash_list.exists() else ""
              if "sonic.exe" not in {line.strip().casefold() for line in existing_splash_skins.splitlines()}:
                  splash_list.write_text(
                      existing_splash_skins.rstrip() + ("\n" if existing_splash_skins.strip() else "") + "Sonic.EXE\n",
                      encoding="utf-8"
                  )
              print(
                  "Installed Sonic.EXE Note Splash skin:",
                  splash_image_name,
                  "->",
                  splash_image_output,
                  f"({splash_image_output.stat().st_size:,} bytes)"
              )

              for source_name, output in images.items():
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(source_name) as source, Image.open(source) as image:
                      image.convert("RGBA").save(output, format="PNG", optimize=True)
                  print(f"Prepared original menu sprite: {output} ({output.stat().st_size:,} bytes)")

              # Retain the original purple frame for the selected option and create a gray idle version.
              # Keep its dimensions and alpha channel exactly aligned with the original.
              box_source = Path("engine/assets/shared/images/sonicexe-menu/options/box.png")
              idle_box_output = Path("engine/assets/shared/images/sonicexe-menu/options/box-idle.png")
              with Image.open(box_source) as box_image:
                  rgba = box_image.convert("RGBA")
                  alpha = rgba.getchannel("A")
                  gray = ImageOps.grayscale(rgba.convert("RGB"))
                  gray = ImageEnhance.Brightness(gray).enhance(1.45)
                  gray = ImageEnhance.Contrast(gray).enhance(0.82)
                  idle_box = Image.merge("RGBA", (gray, gray, gray, alpha))
                  idle_box.save(idle_box_output, format="PNG", optimize=True)
              print(f"Prepared neutral gray idle frame: {idle_box_output} ({idle_box_output.stat().st_size:,} bytes)")

              # Build an alpha-only transition: the Sonic-head area is a transparent
              # window, with solid black outside it. Ignore the source RGB values so
              # the blue artwork is never drawn over the game.
              transition_output = Path("engine/assets/shared/images/sonicexe-transitions/head-wipe.png")
              transition_output.parent.mkdir(parents=True, exist_ok=True)
              frame_width, frame_height, frame_count = 640, 360, 36
              with z.open("assets/exe/transitions/head.webp") as source, Image.open(source) as image:
                  source_rgba = image.convert("RGBA")
                  source_alpha = source_rgba.getchannel("A").resize((frame_width, frame_height), Image.Resampling.LANCZOS)
                  sheet = Image.new("RGBA", (frame_width, frame_height * frame_count), (0, 0, 0, 255))
                  for frame_index in range(frame_count):
                      # Begin with an oversized opening and close it smoothly to a point.
                      progress = frame_index / (frame_count - 1)
                      ease = progress ** 3 * (progress * (progress * 6 - 15) + 10)
                      scale = 1.62 * (1.0 - ease) + 0.004
                      scaled_width = max(1, round(source_alpha.width * scale))
                      scaled_height = max(1, round(source_alpha.height * scale))
                      mask = source_alpha.resize((scaled_width, scaled_height), Image.Resampling.LANCZOS)
                      canvas_mask = Image.new("L", (frame_width, frame_height), 0)
                      left = (frame_width - scaled_width) // 2
                      top = (frame_height - scaled_height) // 2
                      # Clip the centered mask cleanly to the screen-sized frame.
                      src_left = max(0, -left)
                      src_top = max(0, -top)
                      dst_left = max(0, left)
                      dst_top = max(0, top)
                      copy_width = min(scaled_width - src_left, frame_width - dst_left)
                      copy_height = min(scaled_height - src_top, frame_height - dst_top)
                      if copy_width > 0 and copy_height > 0:
                          crop = mask.crop((src_left, src_top, src_left + copy_width, src_top + copy_height))
                          canvas_mask.paste(crop, (dst_left, dst_top))
                      # Opaque source silhouette becomes a fully transparent aperture.
                      frame_alpha = Image.eval(canvas_mask, lambda value: 255 - value)
                      frame = Image.new("RGBA", (frame_width, frame_height), (0, 0, 0, 255))
                      frame.putalpha(frame_alpha)
                      sheet.paste(frame, (0, frame_index * frame_height))
                  sheet.save(transition_output, format="PNG", optimize=True)
              print(f"Prepared {frame_count}-frame transparent Sonic-head wipe: {transition_output} ({transition_output.stat().st_size:,} bytes)")

              # Copy original title-screen assets and matching atlas metadata.
              title_prefix = "assets/exe/title/"
              for name in z.namelist():
                  if not name.startswith(title_prefix) or name.endswith("/"):
                      continue
                  suffix = Path(name).suffix.casefold()
                  if suffix not in {".webp", ".xml", ".json"}:
                      continue
                  relative = Path(name[len(title_prefix):])
                  destination = Path("engine/assets/shared/images/sonicexe-title") / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if suffix == ".webp":
                      with z.open(name) as source, Image.open(source) as image:
                          destination = destination.with_suffix(".png")
                          image.convert("RGBA").save(destination, format="PNG", optimize=True)
                  else:
                      with z.open(name) as source, destination.open("wb") as target:
                          shutil.copyfileobj(source, target)
                  print(f"Prepared original title asset: {destination} ({destination.stat().st_size:,} bytes)")

              # Original red settings background, heading, category bars, and arrows.
              options_prefix = "assets/exe/options/"
              options_output = Path("engine/assets/shared/images/sonicexe-options")
              for name in z.namelist():
                  if not name.startswith(options_prefix) or name.endswith("/"):
                      continue
                  if Path(name).suffix.casefold() != ".webp":
                      continue
                  destination = options_output / (Path(name[len(options_prefix):]).stem + ".png")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(name) as source, Image.open(source) as image:
                      image.convert("RGBA").save(destination, format="PNG", optimize=True)
                  print(f"Prepared original settings artwork: {destination} ({destination.stat().st_size:,} bytes)")

              # Generate a reusable soft radial bloom for the animated Options backdrop.
              # It is a transparent light layer, not a replacement for the original art.
              glow_size = 512
              glow_image = Image.new("RGBA", (glow_size, glow_size), (0, 0, 0, 0))
              glow_pixels = glow_image.load()
              glow_center = (glow_size - 1) * 0.5
              for gy in range(glow_size):
                  for gx in range(glow_size):
                      dx = (gx - glow_center) / glow_center
                      dy = (gy - glow_center) / glow_center
                      distance = (dx * dx + dy * dy) ** 0.5
                      falloff = max(0.0, 1.0 - distance)
                      alpha = round(156 * (falloff ** 2.2))
                      if alpha:
                          glow_pixels[gx, gy] = (255, 220, 190, alpha)
              glow_output = options_output / "ambientGlow.png"
              glow_image.save(glow_output, format="PNG", optimize=True)
              print(f"Prepared animated Options light layer: {glow_output}")

              # Keep the original Sound Test backdrop and its original song-preview videos.
              soundtest_prefix = "assets/exe/soundtest/"
              soundtest_output = Path("engine/assets/shared/images/sonicexe-soundtest")
              video_source_dir = Path("engine/sonicexe-soundtest-source")
              for name in z.namelist():
                  if not name.startswith(soundtest_prefix) or name.endswith("/"):
                      continue
                  suffix = Path(name).suffix.casefold()
                  if suffix == ".webp" and Path(name).name.casefold() == "bgtest.webp":
                      destination = soundtest_output / "bgtest.png"
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(name) as source, Image.open(source) as image:
                          image.convert("RGBA").save(destination, format="PNG", optimize=True)
                      print(f"Prepared original Sound Test background: {destination}")
                  elif suffix == ".mp4" and "/videos/" in name.casefold():
                      destination = video_source_dir / Path(name).name
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(name) as source, destination.open("wb") as target:
                          shutil.copyfileobj(source, target)
                      print(f"Extracted original custom-song preview: {destination}")

              font_files = (
                  "vcr.ttf", "pixel-latin.ttf", "NiseSega.ttf", "NiseSegaSonic.TTF",
                  "SonicFont.ttf", "SonicCD.ttf", "sonic4.ttf", "sonichud.ttf",
                  "Plaza Regular.ttf", "fps.ttf",
              )
              font_dir = Path("engine/assets/fonts")
              font_dir.mkdir(parents=True, exist_ok=True)
              for font_name in font_files:
                  output = font_dir / font_name
                  with z.open("assets/fonts/" + font_name) as source, output.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  print(f"Installed original game font: {output} ({output.stat().st_size:,} bytes)")

              # Original Sonic.EXE menu/title effects. Install them in the engine's
              # standard sounds directory so Paths.sound() resolves the names.
              sound_dir = Path("engine/assets/shared/sounds")
              sound_dir.mkdir(parents=True, exist_ok=True)
              # The release archive uses inconsistent filename casing for some sound assets.
              # Match the original path case-insensitively, then write a predictable lowercase
              # filename for the HTML5 conversion step below.
              archive_names = {name.casefold(): name for name in z.namelist()}
              for sound_name in ("sonic.ogg", "menulaugh.ogg", "menumomentclick.ogg", "menuConfirm.ogg", "scrollmenu.ogg"):
                  archive_path = "assets/shared/sounds/" + sound_name
                  actual_path = archive_names.get(archive_path.casefold())
                  if actual_path is None:
                      matches = [name for name in z.namelist() if Path(name).name.casefold() == sound_name.casefold()]
                      if len(matches) != 1:
                          raise SystemExit(f"Could not uniquely find original sound {sound_name}; matches: {matches}")
                      actual_path = matches[0]
                  output = sound_dir / sound_name.lower()
                  with z.open(actual_path) as source, output.open("wb") as target:
                      shutil.copyfileobj(source, target)
                  print(f"Installed original Sonic.EXE sound: {output} from {actual_path} ({output.stat().st_size:,} bytes)")

              music_output = Path("engine/assets/shared/music/menu-source.ogg")
              music_output.parent.mkdir(parents=True, exist_ok=True)
              with z.open("assets/exe/music/menu.ogg") as source, music_output.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted original menu music source ({music_output.stat().st_size:,} bytes)")

              options_music_output = Path("engine/assets/shared/music/options-source.ogg")
              with z.open("assets/exe/music/options.ogg") as source, options_music_output.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted original Options music source ({options_music_output.stat().st_size:,} bytes)")

              video_source = Path("engine/sonicexe-menu-source.mp4")
              with z.open("assets/exe/mainmenu/menu.mp4") as source, video_source.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted original menu background source ({video_source.stat().st_size:,} bytes)")

              # Find the original introexe movie by filename instead of guessing
              # its directory or filename capitalization.
              intro_candidates = [
                  name for name in z.namelist()
                  if Path(name).suffix.casefold() in {".mp4", ".m4v", ".mov", ".webm"}
                  and re.sub(r"[^a-z0-9]", "", Path(name).stem.casefold()) == "introexe"
              ]
              if not intro_candidates:
                  raise SystemExit("Could not find the original introexe video in the release archive.")
              intro_candidates.sort(key=lambda name: (
                  not name.casefold().startswith("assets/videos/"),
                  Path(name).suffix.casefold() != ".mp4",
                  len(name),
                  name.casefold()
              ))
              introexe_archive_path = intro_candidates[0]
              introexe_source = Path("engine/introexe-source" + Path(introexe_archive_path).suffix.lower())
              with z.open(introexe_archive_path) as source, introexe_source.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted introexe video from {introexe_archive_path} ({introexe_source.stat().st_size:,} bytes)")

              post_intro_source = Path("engine/postIntro-source.mp4")
              with z.open("assets/videos/postIntro.mp4") as source, post_intro_source.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted original postIntro video ({post_intro_source.stat().st_size:,} bytes)")

              title_bg_source = Path("engine/sonicexe-title-bg-source.mp4")
              with z.open("assets/exe/title/statictitlemenu.mp4") as source, title_bg_source.open("wb") as target:
                  shutil.copyfileobj(source, target)
              print(f"Extracted original animated title background source ({title_bg_source.stat().st_size:,} bytes)")
          PY
          rm -rf package

