name: Build HTML5 engine base
run-name: Build HTML5 engine base

on:
  push:
    paths:
      - ".github/workflows/build-html5-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-html5:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential libvlc-dev libvlccore-dev

      - name: Install Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: "4.2.5"

      - name: Fetch open-source Psych Engine HTML5 base
        run: |
          git clone --depth 1 https://github.com/star-studios-official/FNF-PsychEngine-HTML5.git engine
          du -sh engine

      - name: Disable desktop-only Discord integration for web
        working-directory: engine
        run: |
          sed -i 's/<define name="DISCORD_ALLOWED" \/>/<define name="DISCORD_ALLOWED" if="desktop" \/>/' Project.xml
          grep 'DISCORD_ALLOWED' Project.xml

      - name: Install Haxe libraries
        working-directory: engine
        run: |
          haxelib setup "$HOME/haxelib"
          haxelib install hxcpp --quiet
          haxe -cp ./setup -D analyzer-optimize -main Main --interp

      - name: Patch FlxAnimate for HaxeFlixel 6
        working-directory: engine
        run: |
          python3 - <<'PY'
          from pathlib import Path

          animate = Path(".haxelib/flxanimate/git/flxanimate/FlxAnimate.hx")
          anim = Path(".haxelib/flxanimate/git/flxanimate/animate/FlxAnim.hx")

          for path in (animate, anim):
              if not path.is_file():
                  raise SystemExit(f"Expected FlxAnimate source file was not found: {path}")

          source = animate.read_text()
          old_sound_import = "import flixel.system.FlxSound;"
          new_sound_import = """#if (flixel >= "5.3.0")
          import flixel.sound.FlxSound;
          #else
          import flixel.system.FlxSound;
          #end"""
          if old_sound_import in source:
              source = source.replace(old_sound_import, new_sound_import, 1)
          elif "import flixel.sound.FlxSound;" not in source:
              raise SystemExit("Could not locate the FlxAnimate FlxSound import")

          click_import = "import flxanimate.animate.FlxAnim.ClickStuff;"
          if click_import not in source:
              anchor = "import flxanimate.animate.FlxAnim;"
              if anchor not in source:
                  raise SystemExit("Could not locate the FlxAnim import for ClickStuff")
              source = source.replace(anchor, anchor + "\\n" + click_import, 1)
          animate.write_text(source)

          source = anim.read_text()
          old_sound_import = """#if FLX_SOUND_SYSTEM
          import flixel.system.FlxSound;
          #end"""
          new_sound_import = """#if FLX_SOUND_SYSTEM
          #if (flixel >= "5.3.0")
          import flixel.sound.FlxSound;
          #else
          import flixel.system.FlxSound;
          #end
          #end"""
          if old_sound_import in source:
              source = source.replace(old_sound_import, new_sound_import, 1)
          elif "import flixel.sound.FlxSound;" not in source:
              raise SystemExit("Could not locate the FlxAnim FlxSound import")
          anim.write_text(source)

          print("Patched FlxAnimate imports for HaxeFlixel 6.x.")
          PY

      - name: Compile browser target
        working-directory: engine
        run: |
          haxelib run lime build Project.xml html5 -release

      - name: Check browser output
        run: |
          test -f engine/export/release/html5/bin/index.html
          find engine/export/release/html5/bin -maxdepth 2 -type f | head -80
          du -sh engine/export/release/html5/bin

      - name: Upload HTML5 engine test
        uses: actions/upload-artifact@v4
        with:
          name: psych-engine-html5-base
          path: engine/export/release/html5/bin/
          if-no-files-found: error
          retention-days: 14
