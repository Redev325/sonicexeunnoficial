name: Deploy Psych Engine HTML5 menu
run-name: Deploy Psych Engine HTML5 menu

on:
  workflow_run:
    workflows:
      - "Build HTML5 engine base"
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful Build HTML5 engine base run ID"
        required: true
        type: string
  # A workflow_run event can be skipped by GitHub's condition evaluation; this
  # push path lets a deploy-only workflow edit republish the latest successful build.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-html5-menu.yml"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: psych-engine-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check that a workflow-run build is still the latest main commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            MAIN_SHA="$(gh api "repos/$GH_REPO/commits/main" --jq '.sha')"
            if [[ "$SOURCE_SHA" != "$MAIN_SHA" ]]; then
              COMPARISON="$(gh api "repos/$GH_REPO/compare/$SOURCE_SHA...$MAIN_SHA")"
              STATUS="$(jq -r '.status' <<< "$COMPARISON")"
              # A successful engine build may be followed by a deploy-only
              # workflow edit. Allow that exact case, but never deploy an
              # artifact if any game/source/build file changed afterward.
              UNRELATED="$(jq -r '.files[].filename' <<< "$COMPARISON" | grep -vxF '.github/workflows/deploy-html5-menu.yml' || true)"
              if [[ "$STATUS" != "ahead" || -n "$UNRELATED" ]]; then
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                echo "Skipping stale build $SOURCE_SHA; main is $MAIN_SHA (compare=$STATUS)."
                if [[ -n "$UNRELATED" ]]; then printf '%s\n' "$UNRELATED"; fi
                exit 0
              fi
              echo "Allowing build $SOURCE_SHA; the only newer main commit changes deploy-html5-menu.yml."
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Download compiled HTML5 engine
        if: steps.freshness.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            SOURCE_RUN_ID="$(gh run list --repo "$GH_REPO" --workflow "Build HTML5 engine base" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$SOURCE_RUN_ID"
          echo "Deploying successful HTML5 build run: $SOURCE_RUN_ID"
          mkdir -p site
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPO" \
            --name psych-engine-html5-base --dir site
          test -s site/index.html
          test -s site/PsychEngine.js
          # Preflight the runtime assets that previously failed with HTTP 503.
          # These checks confirm the published Pages payload contains them at
          # the exact paths requested by Lime's HTML5 preloader.
          test -s site/assets/shared/data/endless-og/endless-og-hard.json
          test -s site/assets/shared/images/characters/x.xml
          test -s site/assets/shared/images/characters/x.png
          test -s site/assets/shared/images/achievements/ur_good.png
          test -s site/assets/exe/images/sunky/sunker.png
          test -s site/assets/exe/images/sunky/sunker.xml
          echo "Verified HTML5 entry point, engine bundle, Endless OG chart, X atlas, achievement art, and Sunky atlas."
          du -sh site

      - name: Upload compiled game to GitHub Pages
        if: steps.freshness.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish browser build
        if: steps.freshness.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
