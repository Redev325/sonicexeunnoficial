<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090d">
  <title>NEO RHYTHM — Main Menu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090d;
      --panel: rgba(19, 19, 29, .88);
      --line: rgba(255,255,255,.12);
      --text: #f4f2f7;
      --muted: #aaa7b5;
      --accent: #ff425f;
      --accent2: #8d5cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden; color: var(--text);
      background:
        radial-gradient(ellipse at 18% 25%, rgba(141,92,255,.18), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(255,66,95,.15), transparent 36%),
        linear-gradient(135deg, #08080c, #11111b 55%, #09090d);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .22;
      background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    .glow {
      position: fixed; width: 390px; height: 390px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.08); right: -100px; top: -130px;
      box-shadow: 0 0 90px rgba(255,66,95,.10), inset 0 0 80px rgba(141,92,255,.08);
      pointer-events: none;
    }
    .glow::before, .glow::after {
      content: ""; position: absolute; border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%; inset: 35px;
    }
    .glow::after { inset: 75px; }
    main {
      min-height: 100vh; max-width: 1120px; margin: auto; padding: 34px 34px 28px;
      display: grid; grid-template-rows: auto 1fr auto; position: relative;
    }
    header, footer { display: flex; justify-content: space-between; align-items: center; gap: 18px; }
    .brand { display: flex; align-items: center; gap: 12px; letter-spacing: .16em; font-size: 12px; font-weight: 800; }
    .brand-mark {
      width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px;
      background: linear-gradient(145deg, var(--accent), var(--accent2));
      box-shadow: 0 7px 28px rgba(255,66,95,.2); font-size: 16px;
    }
    .status { color: var(--muted); font: 700 10px/1.4 ui-monospace, monospace; letter-spacing: .13em; }
    .content { width: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(270px, .9fr); align-items: center; gap: 52px; padding: 54px 0; }
    .eyebrow { color: #ff8194; font: 800 11px/1.4 ui-monospace, monospace; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 13px 0 14px; max-width: 640px; font-size: clamp(48px, 8vw, 92px); line-height: .92; letter-spacing: -.075em; font-weight: 950; }
    h1 span { display: block; color: transparent; background: linear-gradient(95deg, #ff647d 5%, #bd87ff 90%); background-clip: text; }
    .lead { color: var(--muted); max-width: 430px; font-size: 15px; line-height: 1.7; }
    .menu {
      padding: 22px; border: 1px solid var(--line); border-radius: 20px;
      background: var(--panel); box-shadow: 0 24px 90px rgba(0,0,0,.32);
      backdrop-filter: blur(18px);
    }
    .menu-label { color: #898596; font: 800 10px/1.4 ui-monospace, monospace; letter-spacing: .18em; margin: 2px 0 15px 4px; }
    .menu button {
      appearance: none; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      width: 100%; padding: 16px 15px; margin: 8px 0; border: 1px solid transparent;
      border-radius: 12px; background: rgba(255,255,255,.045); color: var(--text);
      text-align: left; font: 800 14px/1.2 inherit; cursor: pointer; transition: .18s ease;
    }
    .menu button:hover, .menu button:focus-visible {
      outline: none; border-color: rgba(255,100,125,.5); background: rgba(255,66,95,.12);
      transform: translateX(3px);
    }
    .menu button.primary {
      background: linear-gradient(100deg, #ff425f, #9d5bff); box-shadow: 0 8px 24px rgba(255,66,95,.18);
    }
    .menu button.primary:hover, .menu button.primary:focus-visible { filter: brightness(1.12); }
    .arrow { color: rgba(255,255,255,.65); font-size: 18px; }
    footer { color: #777383; font: 700 10px/1.5 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .panel {
      position: fixed; inset: 0; z-index: 5; display: none; place-items: center; padding: 20px;
      background: rgba(4,4,8,.76); backdrop-filter: blur(12px);
    }
    .panel.open { display: grid; }
    .panel-card {
      width: min(100%, 470px); padding: 26px; border: 1px solid var(--line); border-radius: 18px;
      background: #15141f; box-shadow: 0 25px 100px rgba(0,0,0,.55);
    }
    .panel-card h2 { margin: 0 0 16px; font-size: 25px; letter-spacing: -.04em; }
    .panel-card p, .panel-card li { color: var(--muted); font-size: 14px; line-height: 1.7; }
    .panel-card ul { padding-left: 20px; }
    .panel-card button {
      margin-top: 14px; padding: 11px 16px; border: 0; border-radius: 10px;
      background: linear-gradient(100deg, #ff425f, #9d5bff); color: white; font-weight: 800; cursor: pointer;
    }
    @media (max-width: 760px) {
      main { padding: 22px 18px; }
      .content { grid-template-columns: 1fr; gap: 28px; padding: 48px 0 30px; }
      h1 { font-size: clamp(48px, 15vw, 76px); }
      .menu { max-width: 460px; }
      footer span:last-child { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <header>
      <div class="brand"><div class="brand-mark">N</div><span>NEO RHYTHM</span></div>
      <div class="status">BROWSER BUILD · MENU PREVIEW</div>
    </header>
    <section class="content">
      <div>
        <div class="eyebrow">A rhythm engine preview</div>
        <h1>FEEL THE <span>BEAT.</span></h1>
        <p class="lead">A clean starting point for the browser build. Choose an option to explore the menu shell.</p>
      </div>
      <nav class="menu" aria-label="Main menu">
        <div class="menu-label">MAIN MENU / 01</div>
        <button class="primary" id="start"><span>START</span><span class="arrow">→</span></button>
        <button id="controls"><span>CONTROLS</span><span class="arrow">↗</span></button>
        <button id="credits"><span>CREDITS</span><span class="arrow">↗</span></button>
      </nav>
    </section>
    <footer><span>NEO RHYTHM · ORIGINAL MENU SHELL</span><span>USE ↑ ↓ AND ENTER WHEN THE ENGINE IS CONNECTED</span></footer>
  </main>
  <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="panel-card">
      <h2 id="panel-title"></h2>
      <div id="panel-content"></div>
      <button id="close-panel" type="button">BACK</button>
    </div>
  </section>
  <script>
    const panel = document.getElementById('panel');
    const title = document.getElementById('panel-title');
    const content = document.getElementById('panel-content');
    function openPanel(name, html) {
      title.textContent = name;
      content.innerHTML = html;
      panel.classList.add('open');
      document.getElementById('close-panel').focus();
    }
    function closePanel() {
      panel.classList.remove('open');
      document.getElementById('start').focus();
    }
    document.getElementById('start').addEventListener('click', () => {
      openPanel('ENGINE NOT CONNECTED', '<p>This menu shell is ready. The HTML5 engine and a playable demo song still need to be connected before Start can launch gameplay.</p>');
    });
    document.getElementById('controls').addEventListener('click', () => {
      openPanel('CONTROLS', '<ul><li><strong>↑ / ↓</strong> — move through menu items</li><li><strong>ENTER</strong> — select an item</li><li><strong>ESC</strong> — go back</li><li><strong>Arrow keys</strong> — navigate the rhythm engine menus</li></ul>');
    });
    document.getElementById('credits').addEventListener('click', () => {
      openPanel('CREDITS', '<p>Original menu interface created for the Neo Rhythm browser scaffold.</p><p>Engine foundation: open-source Psych Engine HTML5 project. Game-specific artwork, music, and cutscenes are intentionally not included in this menu shell.</p>');
    });
    document.getElementById('close-panel').addEventListener('click', closePanel);
    panel.addEventListener('click', event => { if (event.target === panel) closePanel(); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && panel.classList.contains('open')) closePanel();
    });
  </script>
</body>
</html>
